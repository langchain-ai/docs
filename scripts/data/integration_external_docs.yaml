  middleware:
  - name: PIIAnonymizationMiddleware
    pypi: piighost
    docs_url: https://athroniaeth.github.io/piighost/getting-started/langchain/
    available: Protect personal data (PII) in prompts, tool calls, and agent conversations. Hides sensitive values from the model, then restores the real values in the reply and at the tool boundary, so tools and the user still get the real data. Pluggable regex, NER, and LLM detectors, thread-consistent tokens, and token-by-token streaming restoration.
    source: "[`Athroniaeth/piighost`](https://github.com/Athroniaeth/piighost)"
  - name: attenu-guard
    pypi: attenu-guard
    docs_url: https://attenu.io/docs/example-langgraph/
    available: Per-agent permission enforcement on every tool call and subagent handoff through wrap_tool_call (a subagent's permissions are a computed subset of its parent's), with a hash-chained audit log verified offline
    source: "[`attenu-io/attenu-guard`](https://github.com/attenu-io/attenu-guard)"
  - name: CopilotKit
    pypi: copilotkit
    docs_url: /oss/langchain/frontend/integrations/copilotkit
    available: CopilotKit middleware and FastAPI bridge for Deep Agents, create_agent graphs, AG-UI, and the React and runtime clients
    source: "[`CopilotKit/CopilotKit`](https://github.com/CopilotKit/CopilotKit)"
  - name: compact-middleware
    pypi: compact-middleware
    docs_url: https://github.com/emanueleielo/compact-middleware
    available: Claude Code's compaction engine as LangChain middleware. Multi-level context compaction for long-running agents.
    source: "[`emanueleielo/compact-middleware`](https://github.com/emanueleielo/compact-middleware)"
  - name: Cisco AI Defense
    pypi: langchain-cisco-aidefense
    docs_url: https://github.com/cisco-ai-defense/ai-defense-langchain-middleware
    available: Runtime security inspection
    source: "[`cisco-ai-defense/ai-defense-langchain-middleware`](https://github.com/cisco-ai-defense/ai-defense-langchain-middleware)"
  - name: NeuralTrust TrustGuard
    pypi: langchain-neuraltrust
    docs_url: https://github.com/NeuralTrust/langchain-neuraltrust
    available: TrustGuard evaluate middleware. Allow, block, report, or transform agent input, model output, and optional tool traffic.
    source: "[`NeuralTrust/langchain-neuraltrust`](https://github.com/NeuralTrust/langchain-neuraltrust)"
  - name: DeepKeep middleware
    pypi: langchain-deepkeep
    docs_url: https://docs.deepkeep.ai
    available: DeepKeep AI Firewall pre-moderation and post-moderation for LangChain agents.
  - name: Tessera
    pypi: tessera-mesh
    docs_url: https://github.com/kenithphilip/Tessera
    available: Signed trust labels and taint-tracking that gate tool calls when context contains untrusted segments.
    source: "[`kenithphilip/Tessera`](https://github.com/kenithphilip/Tessera)"
  - name: Haldir
    docs_url: https://github.com/ExposureGuard/haldir/tree/main/integrations/langchain-haldir
    available: Governance layer for LangChain agents with scoped sessions, encrypted secrets, hash-chained audit, and policy enforcement.
    source: "[`ExposureGuard/haldir`](https://github.com/ExposureGuard/haldir/tree/main/integrations/langchain-haldir)"
  - name: Highflame
    pypi: highflame
    docs_url: https://github.com/highflame-ai/highflame-sdk
    available: Runtime AI security guardrails (prompt injection, PII/DLP, content safety) applied as middleware via Highflame Shield (OWASP LLM Top 10).
    source: "[`highflame-ai/highflame-sdk`](https://github.com/highflame-ai/highflame-sdk)"
  - name: langchain-collapse
    pypi: langchain-collapse
    docs_url: https://github.com/johanity/langchain-collapse
    available: Preventive context management. Collapses consecutive tool-call groups before they fill the context window.
    source: "[`johanity/langchain-collapse`](https://github.com/johanity/langchain-collapse)"
  - name: langchain-distil
    pypi: langchain-distil
    docs_url: https://github.com/dshakes/distil
    available: Reversible, certified context compression. Digests large tool outputs and message history before the model call (tool and function messages reversibly, human and system losslessly, the model messages never rewritten), with byte-exact recovery of every digest. Decision-equivalence between compressed and full context is certified offline by a statistical non-inferiority gate.
    source: "[`dshakes/distil`](https://github.com/dshakes/distil)"
  - name: VecrContextCompressor
    pypi: vecr-compress
    docs_url: https://github.com/h2cker/vecr
    available: Deterministic LLM context compression with a regex retention whitelist for structured tokens before the model call.
    source: "[`h2cker/vecr`](https://github.com/h2cker/vecr)"
  - name: OpenBox
    pypi: openbox-langgraph-sdk-python
    docs_url: https://docs.openbox.ai/getting-started/langgraph
    available: Real-time governance for LangGraph and Deep Agents. Policies, guardrails, HITL, OTel hook governance, and behavior rules.
    source: "[`OpenBox-AI/openbox-langgraph-sdk-python`](https://github.com/OpenBox-AI/openbox-langgraph-sdk-python)"
  - name: langchain-task-steering
    pypi: langchain-task-steering
    docs_url: https://github.com/edvinhallvaxhiu/langchain-task-steering
    available: Implicit state-machine middleware for ordered task pipelines with per-task tool scoping, dynamic prompt injection, and composable completion validation.
    source: "[`edvinhallvaxhiu/langchain-task-steering`](https://github.com/edvinhallvaxhiu/langchain-task-steering)"
  - name: advisor-middleware
    pypi: advisor-middleware
    docs_url: https://github.com/emanueleielo/advisor-middleware
    available: Claude Code's advisor pattern as LangChain middleware. Pairs a fast executor model with a powerful advisor model that intervenes only on critical decisions.
    source: "[`emanueleielo/advisor-middleware`](https://github.com/emanueleielo/advisor-middleware)"
  - name: langchain-router
    pypi: langchain-router
    docs_url: https://github.com/johanity/langchain-router
    available: Phase-based model routing. Routes execution turns to a fast model, keeps the primary for planning and recovery.
