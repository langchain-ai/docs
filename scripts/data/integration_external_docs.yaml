# External (third-party) integration rows for download tables.
# These appear in the same component tables as hosted guides, but the name
# column links to docs_url instead of a docs.langchain.com page.
#
# Use this file for integrations that do not yet qualify for a hosted guide
# (under 50,000 monthly downloads and not featured). See:
# https://docs.langchain.com/oss/contributing/publish-langchain#make-your-integration-discoverable
#
# Doc link priority when adding entries: partner docs > GitHub repo > PyPI/npm.
# docs_url must be https://, http://, or a site-relative path starting with /
# (protocol-relative //host and javascript:/data: URLs are rejected).
#
# Consumed by scripts/refresh_integration_downloads.py.

