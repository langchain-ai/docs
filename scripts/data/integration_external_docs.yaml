  middleware:
  - name: CopilotKit
    pypi: copilotkit
    docs_url: /oss/langchain/frontend/integrations/copilotkit
    available: CopilotKit middleware and FastAPI bridge for Deep Agents, create_agent graphs, AG-UI, and the React and runtime clients
    source: "[`CopilotKit/CopilotKit`](https://github.com/CopilotKit/CopilotKit)"
  - name: compact-middleware
    pypi: compact-middleware
    docs_url: https://github.com/emanueleielo/compact-middleware
    available: Claude Code's compaction engine as LangChain middleware. Multi-level context compaction for long-running agents.
    source: "[`emanueleielo/compact-middleware`](https://github.com/emanueleielo/compact-middleware)"
  - name: Cisco AI Defense
    pypi: langchain-cisco-aidefense
    docs_url: https://github.com/cisco-ai-defense/ai-defense-langchain-middleware
    available: Runtime security inspection
    source: "[`cisco-ai-defense/ai-defense-langchain-middleware`](https://github.com/cisco-ai-defense/ai-defense-langchain-middleware)"
  - name: Tessera
    pypi: tessera-mesh
    docs_url: https://github.com/kenithphilip/Tessera
    available: Signed trust labels and taint-tracking that gate tool calls when context contains untrusted segments.
    source: "[`kenithphilip/Tessera`](https://github.com/kenithphilip/Tessera)"
  - name: Haldir
    docs_url: https://haldir.xyz/docs
    available: Governance layer for LangChain agents with scoped sessions, encrypted secrets, hash-chained audit, and policy enforcement.
    source: "[`ExposureGuard/haldir`](https://github.com/ExposureGuard/haldir/tree/main/integrations/langchain-haldir)"
  - name: langchain-collapse
    pypi: langchain-collapse
    docs_url: https://github.com/johanity/langchain-collapse
    available: Preventive context management. Collapses consecutive tool-call groups before they fill the context window.
    source: "[`johanity/langchain-collapse`](https://github.com/johanity/langchain-collapse)"
  - name: langchain-distil
    pypi: langchain-distil
    docs_url: https://github.com/dshakes/distil
    available: Reversible, certified context compression. Digests large tool outputs and message history before the model call (tool and function messages reversibly, human and system losslessly, the model messages never rewritten), with byte-exact recovery of every digest. Decision-equivalence between compressed and full context is certified offline by a statistical non-inferiority gate.
    source: "[`dshakes/distil`](https://github.com/dshakes/distil)"
  - name: langchain-task-steering
    pypi: langchain-task-steering
    docs_url: https://github.com/edvinhallvaxhiu/langchain-task-steering
    available: Implicit state-machine middleware for ordered task pipelines with per-task tool scoping, dynamic prompt injection, and composable completion validation.
    source: "[`edvinhallvaxhiu/langchain-task-steering`](https://github.com/edvinhallvaxhiu/langchain-task-steering)"
  - name: advisor-middleware
    pypi: advisor-middleware
    docs_url: https://github.com/emanueleielo/advisor-middleware
    available: Claude Code's advisor pattern as LangChain middleware. Pairs a fast executor model with a powerful advisor model that intervenes only on critical decisions.
    source: "[`emanueleielo/advisor-middleware`](https://github.com/emanueleielo/advisor-middleware)"
  - name: langchain-router
    pypi: langchain-router
    docs_url: https://github.com/johanity/langchain-router
    available: Phase-based model routing. Routes execution turns to a fast model, keeps the primary for planning and recovery.
    source: "[`johanity/langchain-router`](https://github.com/johanity/langchain-router)"
  - name: text2sql-framework
    pypi: text2sql-framework
    docs_url: https://github.com/Text2SqlAgent/text2sql-framework
    available: Replaces RAG with recursive tool use — the agent explores, writes, tests, and self-corrects using one execute_sql tool.
    source: "[`Text2SqlAgent/text2sql-framework`](https://github.com/Text2SqlAgent/text2sql-framework)"
  - name: NoPII
    pypi: langchain-nopii-middleware
    docs_url: https://github.com/Enigma-Vault/NoPII/tree/main/integrations/langchain-nopii-middleware
    available: Runtime PII tokenization. Detects personal data in outbound prompts, replaces it with deterministic vault tokens before the request reaches the LLM, and restores the original values in the response.
    source: "[`Enigma-Vault/NoPII`](https://github.com/Enigma-Vault/NoPII/tree/main/integrations/langchain-nopii-middleware)"
  - name: eager-tools
    docs_url: https://github.com/cloudthinker-ai/eager-tools
    available: Reduces agent wall-clock latency by dispatching each tool call the moment its streaming block closes, overlapping tool execution with LLM generation.
    source: "[`cloudthinker-ai/eager-tools`](https://github.com/cloudthinker-ai/eager-tools)"
  - name: langgraph-state-machine
    docs_url: https://github.com/mahmoud661/langgraph-state-machine
    available: Section-based flow control for LangGraph React agents. Divides conversations into discrete phases with scoped tools, prompts, auto-transitions, branching, and optional per-section LLM override.
    source: "[`mahmoud661/langgraph-state-machine`](https://github.com/mahmoud661/langgraph-state-machine)"
  - name: OWASP Agent Memory Guard
    pypi: langchain-agent-memory-guard
    docs_url: https://owasp.org/www-project-agent-memory-guard/
    available: Runtime defense against AI agent memory poisoning (OWASP ASI06). Scans messages, model responses, and tool outputs locally with block, warn, and strip modes.
    source: "[`OWASP/www-project-agent-memory-guard`](https://github.com/OWASP/www-project-agent-memory-guard/tree/main/integrations/langchain-agent-memory-guard)"
  - name: DNS-AID
    pypi: langchain-dns-aid
    docs_url: https://github.com/IngmarVG-IB/langchain-dns-aid
    available: DNS-based agent discovery via the DNS-AID protocol. Auto-publishes agents on startup, auto-unpublishes on shutdown, and provides discovery tools.
    source: "[`IngmarVG-IB/langchain-dns-aid`](https://github.com/IngmarVG-IB/langchain-dns-aid)"
  - name: RelayShield
    pypi: langchain-relayshield
    docs_url: https://api.relayshield.net/developers
    available: Mandatory pre-execution gate that blocks connect_mcp_server and install_mcp_package tool calls when RelayShield reports risk.
    source: "[`nzdsf2-gif/langchain-relayshield`](https://github.com/nzdsf2-gif/langchain-relayshield)"
  - name: ATR Guardrail
    docs_url: https://github.com/Agent-Threat-Rule/agent-threat-rules/tree/main/integrations/langchain
    available: Runtime detection of prompt injection, tool poisoning, and unsafe tool calls using Agent Threat Rules. Halts the agent or blocks the tool call on a critical finding and keeps an audit trail.
    source: "[`Agent-Threat-Rule/agent-threat-rules`](https://github.com/Agent-Threat-Rule/agent-threat-rules/tree/main/integrations/langchain)"
  - name: AxioRank
    pypi: langchain-axiorank
    docs_url: https://app.axiorank.com/docs/integrations/langchain
    available: "Security gateway for AI agents: score tool calls and model turns against policy with allow, deny, and redact."
    source: "[`AxioRank/langchain-axiorank`](https://github.com/AxioRank/langchain-axiorank)"
  - name: prompt-shield
    pypi: prompt-shield-ai
    docs_url: https://github.com/mthamil107/prompt-shield
    available: Runtime prompt-injection firewall. Scans inputs, tool results, and outputs across detectors and output scanners with block, flag, and log modes.
    source: "[`mthamil107/prompt-shield`](https://github.com/mthamil107/prompt-shield)"
  - name: comply54
    pypi: langchain-comply54
