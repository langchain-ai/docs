  - name: text2sql-framework
    pypi: text2sql-framework
    docs_url: https://github.com/Text2SqlAgent/text2sql-framework
    available: "Replaces RAG with recursive tool use: the agent explores, writes, tests, and self-corrects using one execute_sql tool."
    source: "[`Text2SqlAgent/text2sql-framework`](https://github.com/Text2SqlAgent/text2sql-framework)"
  - name: NoPII
    pypi: langchain-nopii-middleware
    docs_url: https://github.com/Enigma-Vault/NoPII/tree/main/integrations/langchain-nopii-middleware
    available: Runtime PII tokenization. Detects personal data in outbound prompts, replaces it with deterministic vault tokens before the request reaches the LLM, and restores the original values in the response.
    source: "[`Enigma-Vault/NoPII`](https://github.com/Enigma-Vault/NoPII/tree/main/integrations/langchain-nopii-middleware)"
  - name: TealTiger
    pypi: langchain-tealtiger
    docs_url: https://docs.tealtiger.ai/integrations/langchain
