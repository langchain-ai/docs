    docs_url: https://runcycles.io
    available: Pre-execution budget authority for model calls, tool calls, and agent loops
    source: "[`runcycles/langchain-runcycles`](https://github.com/runcycles/langchain-runcycles)"
  - name: SeekritCredentials
    pypi: seekrit
    docs_url: https://seekrit.dev/docs/guides/frameworks/langgraph#4-scope-a-key-to-one-tool
    available: Scopes secrets per model call and per tool call. Credentials stay as placeholders in agent code and are substituted at the HTTP boundary against a default-deny allowlist, so an unlisted tool cannot reach a credential.
    source: "[`seekritdev/python-sdk`](https://github.com/seekritdev/python-sdk)"
  - name: ATLTaskMiddleware
    pypi: langchain-agenttrafficlab
    docs_url: https://github.com/wenhua6666668-oss/langchain-agenttrafficlab#automatic-task-time-routing-v03
    available: Automatic task-time routing to executable MCP and provider capabilities, with failure redecision and outcome reporting.
    source: "[`wenhua6666668-oss/langchain-agenttrafficlab`](https://github.com/wenhua6666668-oss/langchain-agenttrafficlab)"
  - name: xaidr
    pypi: xaidr
    docs_url: https://github.com/delphisecurity/xaidr#langchain-middleware
    available: In-process runtime security sensor for AI agents. LangChain middleware covering input, tool-call, and output boundaries for prompt injection, jailbreak, DLP, and A2A-protocol scanning.
    source: "[`delphisecurity/xaidr`](https://github.com/delphisecurity/xaidr)"
  - name: ISNAD
    pypi: isnad
    docs_url: https://github.com/alizahidraja/isnad
    available: Claim-level provenance and trust grading for agent outputs. Grades every transmitter in a claim's chain (source, scraper, model) in a living registry, caps the chain at its weakest link, and quarantines fabricated (mawḍūʿ) chains — with a tamper-evident audit trail.
    source: "[`alizahidraja/isnad`](https://github.com/alizahidraja/isnad)"
