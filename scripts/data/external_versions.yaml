# Version requirements that the docs mirror from an upstream source.
#
# scripts/check_external_versions.py reads this file, fetches each upstream
# source, and compares the version it states against the version in the page.
#
# This is for MIRROR CLAIMS only: cases where the docs restate a requirement
# that some other project owns, so the two are supposed to be equal. It is not
# for feature floors ("this setting needs Helm chart 0.11.4 or later"), which
# record when a feature landed. Nothing upstream can tell you that, and a bot
# that bumped such a floor would be telling readers to upgrade for no reason.
#
# Each entry:
#   id       Stable slug, used in output and to scope --only.
#   label    Human name for the requirement, used in the report.
#   page     Path under src/ holding the claim.
#   pattern  Regex with a `version` named group, matched against the page. Must
#            match exactly once. Everything outside the group is preserved on
#            rewrite, so keep enough context to be unambiguous.
#   source   Where the truth lives:
#              type: github_file    repo, path, pattern (a `version` group)
#              type: github_release repo  (uses the latest release tag)

- id: codex-cli
  label: Codex CLI
  page: src/langsmith/trace-with-codex.mdx
  pattern: 'Codex CLI\]\([^)]*\) v(?P<version>[0-9][0-9a-zA-Z.]*) or later'
  source:
    type: github_file
    repo: langchain-ai/langsmith-codex-plugins
    path: README.md
    pattern: 'Codex >= (?P<version>[0-9][0-9a-zA-Z.]*)'

- id: codex-plugin-node
  label: Node.js (Codex tracing plugin)
  page: src/langsmith/trace-with-codex.mdx
  pattern: 'Node\.js\]\([^)]*\) (?P<version>[0-9][0-9a-zA-Z.]*)\.?x? or later'
  source:
    type: github_file
    repo: langchain-ai/langsmith-codex-plugins
    path: README.md
    pattern: 'Node\.js >= (?P<version>[0-9][0-9a-zA-Z.]*)\.?x?'
