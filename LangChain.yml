Documentación de LangChain
¡ Bienvenidos! Este repositorio contiene la documentación del flujo de trabajo para proyectos de LangChain.

🏠 docs.langchain.comes nuestra sede de documentación, que centraliza LangChain, LangGraph, LangSmith y LangChain Labs (Deep Agents, Open SWE, Open Agent Platform). Este sitio está alojado en Mintlify .
🛠️ reference.langchain.comcontiene la documentación de referencia de la API para los paquetes de integración de LangChain, LangGraph, LangSmith y LangChain (p. ej., langchain-anthropic, langchain-openai). Estos son sitios estáticos creados a partir del código fuente e implementados en Vercel .
