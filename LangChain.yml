docs.langchain.com
El flujo de trabajo de documentación de Mintlify está estructurado con .mdxarchivos fuente /srcy artefactos de compilación en formato /build. Mintlify se implementa desde la /buildcarpeta generada por la lógica de preprocesamiento.

Importante

Nunca edites /builddirectamente.

El /src/docs.jsonarchivo se utiliza para configurar la navegación y la configuración del sitio de Mintlify. Consulte la documentación de Mintlify para obtener información detallada sobre la sintaxis y el uso de los componentes.

Los cambios en la documentación siguen un flujo de trabajo de PR donde todas las pruebas deben aprobarse antes de la fusión. Consulte las directrices de contribución para obtener más información.

reference.langchain.com
Cada lenguaje tiene su propio flujo de compilación en [nombre del lenguaje /reference/<language>]. La documentación de referencia se crea combinando la extracción automatizada de cadenas de documentación y la escritura manual de contenido. Consulta el [nombre del lenguaje] README.mden cada carpeta para obtener más información sobre cómo compilar y contribuir.

Los archivos compilados se almacenan en [nombre del archivo] /reference/dist/{LANGUAGE}y luego se implementan en Vercel. El proceso de compilación se activa automáticamente al enviar archivos a [nombre del archivo] mainy también puede activarse manualmente a través del panel de control de Vercel.

Formatos de archivo
Archivos Markdown ( .md, .mdx) - Contenido de la documentación estándar
Fragmentos ( src/snippets/): Contenido MDX reutilizable que se puede importar a varias páginas. Importante: Los fragmentos se someten a un preprocesamiento de enlaces especial. Al escribir enlaces en fragmentos, tenga cuidado con los segmentos de ruta.
Cuadernos Jupyter ( .ipynb): Se convierten a Markdown durante la compilación, aunque no se recomiendan para contenido nuevo. Es probable que su solicitud de solicitud (PR) sea rechazada si intenta agregar un cuaderno Jupyter a menos que un responsable lo solicite.
Activos : las imágenes y otros archivos se copian al directorio de compilación
Comandos disponibles
Realizar comandos:

make dev- Iniciar el modo de desarrollo con observación de archivos y reconstrucción en vivo
make build- Construir documentación en ./buildel directorio
make mint-broken-links- Verificar enlaces rotos en la documentación compilada (excluye integraciones)
make mint-broken-links-all- Verificar enlaces rotos en la documentación compilada (incluye todos los directorios)
make build-references- Documentación de referencia de compilación
make preview-references- Vista previa de documentos de referencia usando Vercel
make install- Instalar todas las dependencias
make clean- Eliminar artefactos de compilación
make test- Ejecutar el conjunto de pruebas
make lint- Verificar el estilo y formato del código
make format- Código de formato automático
make lint_md- Archivos Markdown de Lint
make lint_md_fix- Pelar y corregir archivos Markdown
make help- Mostrar todos los comandos disponibles
docsHerramienta CLI:

El docscomando (instalado como uv run docs) proporciona funcionalidad adicional:

docs migrate <path>- Convertir archivos markdown/notebook de MkDocs al formato Mintlify

--dry-run- Vista previa de los cambios sin escribir archivos
--output <path>- Especificar la ubicación de salida (predeterminado: en el lugar)
Admite archivos .md, .markdown,.ipynb
docs migrate-docusaurus <path>- Convertir archivos markdown/notebook de Docusaurus al formato Mintlify

--dry-run- Vista previa de los cambios sin escribir archivos
--output <path>- Especificar la ubicación de salida (predeterminado: en el lugar)
Admite archivos .md, .markdown, .mdx,.ipynb
Convierte la sintaxis específica de Docusaurus (advertencias, tabulaciones, importaciones, etc.)
docs mv <old_path> <new_path>- Mover archivos y actualizar referencias cruzadas

--dry-run- Vista previa de los cambios sin mover archivos
Estos se pueden utilizar directamente mediante Makefileo a través de la docsherramienta CLI:

docs dev- Iniciar el modo de desarrollo con observación de archivos y recarga en caliente

Reconstruye automáticamente los archivos modificados de src/abuild/
Inicia el servidor de desarrollo de Mintlify en http://localhost:3000
Proporciona actualización automática del navegador cuando cambian los archivos
--skip-build- Omitir la compilación inicial y utilizar el directorio de compilación existente
docs build- Crear archivos de documentación

--watch- Esté atento a los cambios de archivos después de la compilación
Solución de problemas
docs devno funciona / no se está ejecutando
Vuelva a realizar los pasos para configurar su entorno de desarrollo , asegurándose de haber activado el entorno virtual e instalado todas las dependencias.

.venvError de análisis de Mintlify
Problema : ejecutar mint broken-linksu otros comandos de Mintlify desde la raíz del proyecto provoca errores de análisis como:

Unable to parse .venv/lib/python3.13/site-packages/soupsieve-2.7.dist-info/licenses/LICENSE.md
- 3:48: Unexpected character '@' (U+0040) in name
Causa raíz : Mintlify intenta analizar todos los archivos del directorio, incluidos los archivos del entorno virtual de Python que contienen una sintaxis MDX no válida.

Soluciones (en orden de preferencia):

Utilice los comandos Make seguros (recomendados):

make mint-broken-links  # Builds docs first, then checks links (excludes integrations)
Ejecute los comandos de Mintlify desde el directorio de compilación :

cd build               # Change to build directory where final docs are
mint broken-links      # Now safe to run
Por qué funciona : La solución garantiza que los comandos de Mintlify se ejecuten desde el build/directorio donde se genera la documentación final, que es el lugar correcto para verificar enlaces rotos. Esto evita escanear el entorno virtual de Python en la raíz del proyecto.

Prevención : utilice siempre los comandos Make proporcionados en lugar de ejecutar mintcomandos sin procesar desde la raíz del proyecto.

Advertencia: la página no existe
Si agrega un nuevo grupo, asegúrese de que la raíz index.mdxesté incluida en la pagesmatriz como:

{
  "group": "New group",
  "pages": ["new-group/index", "new-group/other-page"]
}
Si se omite el final /index(sin incluir la extensión), el analizador de Mintlify emitirá una advertencia aunque el sitio se compilará de todos modos.

Errores generales de Mintlify
En algunos casos, utilizamos nuevas funciones que solo están disponibles en la última versión de Mintlify CLI. Si encuentra algún error, asegúrese de tener instalada la última versión:

mint update

# or

npm install -g mint
