StylesPath = .github/vale/styles
MinAlertLevel = error
SkippedScopes = text.frontmatter

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = LangChain, proselint, vale, write-good
BlockIgnores = (?s)(```[^\n]*\n[\s\S]*?```)

