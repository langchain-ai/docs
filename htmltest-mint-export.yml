  - "docs\\.langchain\\.com/langsmith/agent-server-api/"
  - "https://auth.langchain.com"
  - "https://eu.auth.langchain.com"
  # API host roots often 404 without a path; they are endpoints, not docs pages
  - "api\\.host\\.langchain\\.com"
