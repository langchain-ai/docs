<svg xmlns="http://www.w3.org/2000/svg" id="diagram" style="color-scheme: light" width="820" height="400" viewBox="0 0 820 400" role="img" aria-labelledby="title desc">
  <title id="title">Scaling responds differently to rising and falling demand</title>
  <desc id="desc">A qualitative chart, not a benchmark. The load-based host target rises first, then ready hosts catch up as nodes start. When demand falls, the autoscaler holds the peak before reducing its replica target one host per stabilization window.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1.34 0.5L10 5L1.34 9.5Z" fill="#40668D"/></marker>
  </defs>
  <rect x="468" y="80" width="124" height="211" fill="#FDF3FF"/>
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 72V292H790" stroke="#40668D" marker-end="url(#arrow)"/>
    <path d="M80 260H196V108H468V260H784" stroke="#6E8900" stroke-width="3"/>
    <path d="M80 252H188V100H592V138H644V176H696V214H748V252H784" stroke="#006DDD" stroke-width="3"/>
    <path d="M80 244H240V206H276V168H312V130H348V92H610V130H662V168H714V206H766V244H784" stroke="#885270" stroke-width="3"/>
    <path d="M204 119H340" stroke="#40668D" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M680 108V160.5" stroke="#40668D" marker-end="url(#arrow)"/>
    <path d="M74 358H114" stroke="#6E8900" stroke-width="3"/>
    <path d="M319 358H359" stroke="#006DDD" stroke-width="3"/>
    <path d="M565 358H605" stroke="#885270" stroke-width="3"/>
  </g>
  <g id="labels" font-family="TWK Lausanne, Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#030710">
    <text x="36" y="182" text-anchor="middle" transform="rotate(-90 36 182)" fill="#2F4B68">Host count</text>
    <text x="796" y="318" text-anchor="end" fill="#2F4B68">Time</text>
    <text x="272" y="78" text-anchor="middle" font-weight="600" fill="#006DDD">Provisioning delay</text>
    <text x="530" y="44" text-anchor="middle" font-weight="600" fill="#504B5F">Hold peak</text>
    <text x="530" y="66" text-anchor="middle" font-size="15" fill="#504B5F">Stabilization window</text>
    <text x="624" y="100" font-weight="600" fill="#006DDD">Gradual scale-down</text>
    <text x="192" y="318" text-anchor="middle">Demand rises</text>
    <text x="468" y="318" text-anchor="middle">Demand falls</text>
    <text x="125" y="363.71">Load-based target</text>
    <text x="370" y="363.71">Replica target</text>
    <text x="616" y="363.71">Ready hosts</text>
  </g>
</svg>
