    <text x="750" y="639.21" text-anchor="middle" font-size="16" font-weight="600">Object storage</text>
    <text x="750" y="661.71" text-anchor="middle">Disk, saved memory</text>
    <text x="750" y="684.21" text-anchor="middle" fill="#441E33">Snapshots and data blocks</text>
    <text x="40" y="576.35" fill="#2F4B68">SQL</text>
