<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" role="img" aria-labelledby="title desc">
  <title id="title">Self-hosted Sandbox architecture</title>
  <desc id="desc">Clients reach the platform backend in the LangSmith Kubernetes cluster. The backend uses PostgreSQL and routes to sandbox hosts on dedicated KVM nodes. Kubernetes Leases coordinate hosts. JuiceFS stores metadata in dedicated Redis and data in object storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40668D"/></marker>
  </defs>
  <rect width="900" height="730" rx="16" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#030710">
    <rect x="22" y="118" width="856" height="407" rx="14" fill="#F2FAFF" stroke="#40668D"/>
    <text x="44" y="145" font-size="13" font-weight="700" fill="#2F4B68">YOUR KUBERNETES CLUSTER · LANGSMITH NAMESPACE</text>
    <rect x="50" y="20" width="260" height="68" rx="10" fill="#F6FFDB" stroke="#6E8900" stroke-width="2"/>
    <text x="180" y="48" text-anchor="middle" font-weight="700">Your apps and agents</text>
    <text x="180" y="71" text-anchor="middle" fill="#2E3900">LangSmith SDK / API</text>
    <path d="M180 88 V178" fill="none" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="50" y="180" width="260" height="96" rx="10" fill="#E5F4FF" stroke="#006DDD" stroke-width="2"/>
    <text x="180" y="208" text-anchor="middle" font-weight="700">platform-backend</text>
    <text x="180" y="233" text-anchor="middle">Authentication · placement</text>
    <text x="180" y="255" text-anchor="middle">Sandbox traffic proxy</text>
    <path d="M310 228 H353" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="50" y="345" width="260" height="82" rx="10" fill="#FFFFFF" stroke="#40668D"/>
    <text x="180" y="374" text-anchor="middle" font-weight="700">Kubernetes API</text>
    <text x="180" y="399" text-anchor="middle">Leases · Deployment replicas</text>
    <path d="M310 386 H353" fill="none" stroke="#40668D" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="50" y="460" fill="#2F4B68">Existing LangSmith node pool</text>
    <text x="50" y="483" fill="#2F4B68">Other platform services unchanged</text>
    <rect x="355" y="165" width="495" height="330" rx="10" fill="#FFFFFF" stroke="#B27D75" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="375" y="191" font-size="13" font-weight="700" fill="#634643">DEDICATED KVM-CAPABLE NODE POOL</text>
    <text x="375" y="212" font-size="14" fill="#634643">One host pod per node · many microVMs per host</text>
    <g>
      <rect x="369" y="232" width="143" height="247" rx="8" fill="#F2FAFF" stroke="#40668D"/>
      <text x="384" y="256" font-weight="700">Node 1</text>
      <rect x="379" y="270" width="123" height="166" rx="7" fill="#F8E8E6" stroke="#B27D75"/>
      <text x="440" y="293" text-anchor="middle" font-size="14" font-weight="700">sandbox-host</text>
      <text x="440" y="314" text-anchor="middle" font-size="13" fill="#634643">Elected leader</text>
      <rect x="390" y="329" width="27" height="30" rx="4" fill="#B27D75"/>
      <rect x="427" y="329" width="27" height="30" rx="4" fill="#B27D75"/>
      <rect x="464" y="329" width="27" height="30" rx="4" fill="#B27D75"/>
      <text x="440" y="382" text-anchor="middle" font-size="14">microVMs</text>
      <rect x="388" y="398" width="104" height="28" rx="5" fill="#EBD0F0" stroke="#885270"/>
      <text x="440" y="417" text-anchor="middle" fill="#441E33">JuiceFS</text>
      <text x="440" y="460" text-anchor="middle" font-size="14" fill="#2F4B68">Local cache</text>
    </g>
    <g>
      <rect x="531" y="232" width="143" height="247" rx="8" fill="#F2FAFF" stroke="#40668D"/>
      <text x="546" y="256" font-weight="700">Node 2</text>
      <rect x="541" y="270" width="123" height="166" rx="7" fill="#F8E8E6" stroke="#B27D75"/>
      <text x="602" y="293" text-anchor="middle" font-size="14" font-weight="700">sandbox-host</text>
      <rect x="552" y="329" width="27" height="30" rx="4" fill="#B27D75"/>
      <rect x="589" y="329" width="27" height="30" rx="4" fill="#B27D75"/>
