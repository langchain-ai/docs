    <text x="422" y="478" text-anchor="middle" fill="#2F4B68">Local cache</text>
    <text x="524" y="270" font-weight="600">Node 2</text>
    <text x="586" y="308" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600">sandbox-host</text>
    <text x="586" y="394" text-anchor="middle">microVMs</text>
    <text x="586" y="428.35" text-anchor="middle" fill="#441E33">JuiceFS</text>
