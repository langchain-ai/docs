      <rect x="550" y="398" width="104" height="28" rx="5" fill="#EBD0F0" stroke="#885270"/>
      <text x="602" y="417" text-anchor="middle" fill="#441E33">JuiceFS</text>
      <text x="602" y="460" text-anchor="middle" font-size="14" fill="#2F4B68">Local cache</text>
    </g>
    <g>
      <rect x="693" y="232" width="143" height="247" rx="8" fill="#F2FAFF" stroke="#40668D"/>
      <text x="708" y="256" font-weight="700">Node 3</text>
      <rect x="703" y="270" width="123" height="166" rx="7" fill="#F8E8E6" stroke="#B27D75"/>
      <text x="764" y="293" text-anchor="middle" font-size="14" font-weight="700">sandbox-host</text>
      <rect x="714" y="329" width="27" height="30" rx="4" fill="#B27D75"/>
      <rect x="751" y="329" width="27" height="30" rx="4" fill="#B27D75"/>
      <text x="764" y="382" text-anchor="middle" font-size="14">microVMs</text>
      <rect x="712" y="398" width="104" height="28" rx="5" fill="#EBD0F0" stroke="#885270"/>
      <text x="764" y="417" text-anchor="middle" fill="#441E33">JuiceFS</text>
      <text x="764" y="460" text-anchor="middle" font-size="14" fill="#2F4B68">Local cache</text>
    </g>
    <path d="M50 228 H34 V628 H49" fill="none" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="50" y="564" fill="#2F4B68">SQL</text>
    <path d="M440 479 V549 H764 V479 M602 495 V549 M472 549 V588 M737 549 V588" fill="none" stroke="#885270" stroke-width="2"/>
    <text x="602" y="574" text-anchor="middle" fill="#441E33">Shared filesystem</text>
    <rect x="50" y="590" width="260" height="99" rx="10" fill="#E5F4FF" stroke="#006DDD" stroke-width="2"/>
    <text x="180" y="618" text-anchor="middle" font-weight="700">PostgreSQL</text>
    <text x="180" y="644" text-anchor="middle">Sandbox records</text>
    <text x="180" y="669" text-anchor="middle">Hosts and placement</text>
    <rect x="355" y="590" width="235" height="99" rx="10" fill="#EBD0F0" stroke="#885270" stroke-width="2"/>
    <text x="472" y="618" text-anchor="middle" font-weight="700">Dedicated Redis</text>
    <text x="472" y="644" text-anchor="middle">File tree · chunk map</text>
    <text x="472" y="669" text-anchor="middle" fill="#441E33">Durable metadata</text>
    <rect x="620" y="590" width="235" height="99" rx="10" fill="#EBD0F0" stroke="#885270" stroke-width="2"/>
    <text x="737" y="618" text-anchor="middle" font-weight="700">Object storage</text>
    <text x="737" y="644" text-anchor="middle">Disk · saved memory</text>
    <text x="737" y="669" text-anchor="middle" fill="#441E33">Snapshots and data blocks</text>
  </g>
</svg>
