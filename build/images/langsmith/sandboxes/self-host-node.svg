<svg xmlns="http://www.w3.org/2000/svg" id="diagram" style="color-scheme: light" width="820" height="630" viewBox="0 0 820 630" role="img" aria-labelledby="title desc">
  <title id="title">Inside one sandbox node</title>
  <desc id="desc">A dedicated Kubernetes node contains a privileged sandbox-host pod. The daemon manages multiple Firecracker microVMs with separate kernels and guest agents. A host-owned JuiceFS client connects their disk and saved-memory images to shared storage outside the node. KVM and a disposable cache are node resources.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1.34 0.5L10 5L1.34 9.5Z" fill="#40668D"/></marker>
  </defs>
  <g stroke-width="1">
    <rect x="16" y="16" width="788" height="520" rx="14" fill="#F2FAFF" stroke="#40668D"/>
    <rect x="40" y="64" width="740" height="364" rx="12" fill="#F2FAFF" stroke="#634643" stroke-width="2"/>
    <rect x="64" y="116" width="692" height="64" rx="8" fill="#E5F4FF" stroke="#006DDD" stroke-width="2"/>
    <rect x="64" y="220" width="328" height="104" rx="10" fill="#F8E8E6" stroke="#634643" stroke-width="2"/>
    <rect x="428" y="220" width="328" height="104" rx="10" fill="#F8E8E6" stroke="#634643" stroke-width="2"/>
    <rect x="64" y="356" width="692" height="48" rx="8" fill="#EBD0F0" stroke="#885270" stroke-width="2"/>
    <rect x="64" y="460" width="220" height="52" rx="8" fill="#F2FAFF" stroke="#40668D"/>
    <rect x="300" y="460" width="220" height="52" rx="8" fill="#F2FAFF" stroke="#40668D"/>
    <rect x="520" y="568" width="252" height="48" rx="8" fill="#EBD0F0" stroke="#885270"/>
  </g>
  <g fill="none" stroke="#40668D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M228 180V214"/>
    <path d="M592 180V214"/>
    <path d="M228 324V350"/>
    <path d="M592 324V350"/>
    <path d="M410 404V454"/>
    <path d="M646 404V562"/>
  </g>
  <g id="labels" font-family="TWK Lausanne, Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#030710">
    <text x="40" y="46" fill="#1A5EAA">Dedicated Kubernetes node, KVM available</text>
    <text x="64" y="94" fill="#634643"><tspan font-family="IBM Plex Mono, monospace">sandbox-host</tspan> pod, privileged, host network</text>
    <text x="410" y="142.07" text-anchor="middle" font-size="17" font-weight="600"><tspan font-family="IBM Plex Mono, monospace">sandbox-host</tspan> daemon</text>
    <text x="410" y="166.07" text-anchor="middle">Lifecycle, traffic proxy, health, idle stop</text>
    <text x="228" y="254.07" text-anchor="middle" font-size="17" font-weight="600">Firecracker microVM A</text>
    <text x="228" y="278.07" text-anchor="middle">Guest kernel, guest agent</text>
    <text x="228" y="302.07" text-anchor="middle" fill="#634643">Guest memory, filesystem</text>
    <text x="592" y="254.07" text-anchor="middle" font-size="17" font-weight="600">Firecracker microVM B</text>
    <text x="592" y="278.07" text-anchor="middle">Guest kernel, guest agent</text>
    <text x="592" y="302.07" text-anchor="middle" fill="#634643">Guest memory, filesystem</text>
    <text x="410" y="385.71" text-anchor="middle" fill="#441E33">JuiceFS client: shared disk and saved-memory images</text>
    <text x="174" y="491.95" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600">/dev/kvm</text>
    <text x="410" y="491.71" text-anchor="middle">Disposable local cache</text>
    <text x="646" y="597.71" text-anchor="middle" fill="#441E33">Shared Redis + object store</text>
  </g>
</svg>
