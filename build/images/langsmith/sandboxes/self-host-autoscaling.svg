<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
  <title id="title">Two layers of Sandbox autoscaling</title>
  <desc id="desc">Layer one: hosts publish committed CPU through Leases, an elected host computes the target, and the Deployment creates host pods. Layer two: a pending host needs an eligible node, the node autoscaler provisions one, and the host checks storage before joining the ready pool.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#40668D"/></marker></defs>
  <rect width="820" height="470" rx="16" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#030710">
    <rect x="20" y="20" width="780" height="179" rx="12" fill="#F2FAFF" stroke="#40668D"/>
    <text x="42" y="53" font-size="14" font-weight="700" fill="#2F4B68">LAYER 1 · LANGSMITH HOST AUTOSCALER</text>
    <rect x="40" y="77" width="220" height="96" rx="9" fill="#E5F4FF" stroke="#006DDD" stroke-width="2"/>
    <text x="150" y="104" text-anchor="middle" font-weight="700">Hosts report load</text>
    <text x="150" y="130" text-anchor="middle">Committed vCPU</text>
    <text x="150" y="153" text-anchor="middle">Kubernetes Leases</text>
    <path d="M260 125 H297" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="77" width="220" height="96" rx="9" fill="#E5F4FF" stroke="#006DDD" stroke-width="2"/>
    <text x="410" y="104" text-anchor="middle" font-weight="700">Leader sizes pool</text>
    <text x="410" y="130" text-anchor="middle">Target + headroom</text>
    <text x="410" y="153" text-anchor="middle">Clamp to min / max</text>
    <path d="M520 125 H557" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="77" width="220" height="96" rx="9" fill="#E5F4FF" stroke="#006DDD" stroke-width="2"/>
    <text x="670" y="104" text-anchor="middle" font-weight="700">Deployment scales</text>
    <text x="670" y="130" text-anchor="middle">Desired host replicas</text>
    <text x="670" y="153" text-anchor="middle">New pods need nodes</text>
    <path d="M670 173 V222 H150 V244" fill="none" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="246" width="780" height="194" rx="12" fill="#F6FFDB" stroke="#6E8900"/>
    <text x="42" y="277" font-size="14" font-weight="700" fill="#2E3900">LAYER 2 · YOUR NODE AUTOSCALER</text>
    <rect x="40" y="301" width="220" height="109" rx="9" fill="#FFFFFF" stroke="#6E8900" stroke-width="2"/>
    <text x="150" y="330" text-anchor="middle" font-weight="700">Host pod is Pending</text>
    <text x="150" y="359" text-anchor="middle">No eligible node</text>
    <text x="150" y="385" text-anchor="middle">without a host</text>
    <path d="M260 355 H297" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="301" width="220" height="109" rx="9" fill="#FFFFFF" stroke="#6E8900" stroke-width="2"/>
    <text x="410" y="330" text-anchor="middle" font-weight="700">Provision a node</text>
    <text x="410" y="359" text-anchor="middle">KVM-capable pool</text>
    <text x="410" y="385" text-anchor="middle">Limits and quota apply</text>
    <path d="M520 355 H557" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="301" width="220" height="109" rx="9" fill="#FFFFFF" stroke="#6E8900" stroke-width="2"/>
    <text x="670" y="330" text-anchor="middle" font-weight="700">Host becomes ready</text>
    <text x="670" y="359" text-anchor="middle">Mount and check storage</text>
    <text x="670" y="385" text-anchor="middle">Accept placements</text>
  </g>
</svg>
