<svg xmlns="http://www.w3.org/2000/svg" id="diagram" style="color-scheme: dark" width="1380" height="340" viewBox="0 0 1380 340" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">SmithDB write path</title>
  <desc id="desc">The platform backend adds a task to Redis. An ingest queue worker writes the runs to SmithDB ingestion, which writes segments to object storage and segment rows to the metastore, then acknowledges the write.</desc>

    <defs>
      <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7cc4fa" stroke-width="1.8"/></marker>
    </defs>
    <rect x="0" y="0" width="1380" height="340" rx="16" fill="#03070f"/>

    <rect x="30" y="100" width="210" height="84" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <line x1="30" y1="128" x2="240" y2="128" stroke="#7cc4fa" stroke-width="1.5"/>
    <text x="135" y="119" text-anchor="middle" font-size="14" fill="#e6f1fb">Platform Backend</text>
    <text x="42" y="150" font-size="12.5" fill="#c9dcf0">Go API (run ingestion)</text>
    <text x="42" y="172" font-size="11" fill="#8a9bb4">langsmith-platform-backend</text>

    <rect x="300" y="100" width="170" height="84" rx="10" fill="#2e3800" stroke="#8aa61a" stroke-width="2"/>
    <text x="385" y="132" text-anchor="middle" font-size="14" fill="#e4f59a">Redis</text>
    <text x="385" y="154" text-anchor="middle" font-size="12.5" fill="#e4f59a">(ingestion queue)</text>
    <text x="385" y="215" text-anchor="middle" font-size="11" fill="#8a9bb4">task waits here</text>

    <rect x="530" y="100" width="210" height="84" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <line x1="530" y1="128" x2="740" y2="128" stroke="#7cc4fa" stroke-width="1.5"/>
    <text x="635" y="119" text-anchor="middle" font-size="14" fill="#e6f1fb">Ingest Queue</text>
    <text x="542" y="150" font-size="12.5" fill="#c9dcf0">workers (runs)</text>
    <text x="542" y="172" font-size="11" fill="#8a9bb4">langsmith-ingest-queue</text>

    <rect x="800" y="100" width="250" height="84" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <line x1="800" y1="128" x2="1050" y2="128" stroke="#7cc4fa" stroke-width="1.5"/>
    <text x="925" y="119" text-anchor="middle" font-size="14" fill="#e6f1fb">SmithDB Ingestion</text>
    <text x="812" y="150" font-size="12.5" fill="#c9dcf0">run writes (L0 → L1 segments)</text>
    <text x="812" y="172" font-size="11" fill="#8a9bb4">langsmith-smithdb-ingestion</text>
    <text x="925" y="215" text-anchor="middle" font-size="11" fill="#8a9bb4">rows in memory</text>
    <text x="925" y="231" text-anchor="middle" font-size="11" fill="#8a9bb4">L0 copies on disk cache</text>

    <circle cx="1270" cy="110" r="72" fill="#2e3800" stroke="#8aa61a" stroke-width="2"/>
    <text x="1270" y="104" text-anchor="middle" font-size="14" fill="#e4f59a">Object</text>
    <text x="1270" y="124" text-anchor="middle" font-size="14" fill="#e4f59a">Storage</text>
    <text x="1270" y="144" text-anchor="middle" font-size="11" fill="#8a9bb4">(segments)</text>

    <rect x="1170" y="235" width="200" height="74" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <text x="1270" y="266" text-anchor="middle" font-size="14" fill="#e6f1fb">Postgres Metastore</text>
    <text x="1270" y="288" text-anchor="middle" font-size="11" fill="#8a9bb4">(segment rows)</text>

    <path d="M240 142 H298" marker-end="url(#f)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <circle cx="269" cy="122" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="269" y="126" text-anchor="middle" font-size="12" fill="#7cc4fa">1</text>
    <path d="M470 142 H528" marker-end="url(#f)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <circle cx="499" cy="122" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="499" y="126" text-anchor="middle" font-size="12" fill="#7cc4fa">2</text>
    <path d="M740 135 H798" marker-end="url(#f)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <circle cx="769" cy="115" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="769" y="119" text-anchor="middle" font-size="12" fill="#7cc4fa">3</text>
    <path d="M1050 135 H1196" marker-end="url(#f)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <text x="1123" y="155" text-anchor="middle" font-size="12" fill="#8a9bb4">segment</text>
    <circle cx="1123" cy="115" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="1123" y="119" text-anchor="middle" font-size="12" fill="#7cc4fa">4</text>
    <path d="M1050 165 H1110 V272 H1168" marker-end="url(#f)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <text x="1139" y="264" text-anchor="middle" font-size="12" fill="#8a9bb4">row</text>
    <circle cx="1110" cy="215" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="1110" y="219" text-anchor="middle" font-size="12" fill="#7cc4fa">5</text>
    <path d="M800 170 H742" marker-end="url(#f)" stroke="#7cc4fa" stroke-width="1.75" fill="none" stroke-dasharray="6 6"/>
    <circle cx="769" cy="192" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="769" y="196" text-anchor="middle" font-size="12" fill="#7cc4fa">6</text>
    <text x="769" y="225" text-anchor="middle" font-size="12" fill="#8a9bb4">ack</text>
  
</svg>
