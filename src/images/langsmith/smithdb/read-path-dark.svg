<svg xmlns="http://www.w3.org/2000/svg" id="diagram" style="color-scheme: dark" width="1380" height="360" viewBox="0 0 1380 360" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">SmithDB read path</title>
  <desc id="desc">The platform backend queries SmithDB query, which reads the segment list from the metastore and segments from its disk cache, object storage, or the ingestion pod that wrote them.</desc>

    <defs>
      <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7cc4fa" stroke-width="1.8"/></marker>
    </defs>
    <rect x="0" y="0" width="1380" height="360" rx="16" fill="#03070f"/>

    <rect x="30" y="120" width="210" height="84" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <line x1="30" y1="148" x2="240" y2="148" stroke="#7cc4fa" stroke-width="1.5"/>
    <text x="135" y="139" text-anchor="middle" font-size="14" fill="#e6f1fb">Platform Backend</text>
    <text x="42" y="170" font-size="12.5" fill="#c9dcf0">Go API (trace reads)</text>
    <text x="42" y="192" font-size="11" fill="#8a9bb4">langsmith-platform-backend</text>

    <rect x="330" y="110" width="300" height="104" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <line x1="330" y1="138" x2="630" y2="138" stroke="#7cc4fa" stroke-width="1.5"/>
    <text x="480" y="129" text-anchor="middle" font-size="14" fill="#e6f1fb">SmithDB Query</text>
    <text x="342" y="162" font-size="12.5" fill="#c9dcf0">query or optional pool</text>
    <text x="342" y="180" font-size="12.5" fill="#c9dcf0">(UI and API reads, stats, …)</text>
    <text x="342" y="202" font-size="11" fill="#8a9bb4">langsmith-smithdb-query</text>

    <rect x="380" y="265" width="200" height="60" rx="10" fill="#2e3800" stroke="#8aa61a" stroke-width="2"/>
    <text x="480" y="291" text-anchor="middle" font-size="12.5" fill="#e4f59a">Disk cache</text>
    <text x="480" y="311" text-anchor="middle" font-size="11" fill="#8a9bb4">(copies of segments)</text>

    <rect x="760" y="30" width="230" height="74" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <text x="875" y="61" text-anchor="middle" font-size="14" fill="#e6f1fb">Postgres Metastore</text>
    <text x="875" y="83" text-anchor="middle" font-size="11" fill="#8a9bb4">(segment rows)</text>

    <rect x="760" y="245" width="250" height="84" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <line x1="760" y1="273" x2="1010" y2="273" stroke="#7cc4fa" stroke-width="1.5"/>
    <text x="885" y="264" text-anchor="middle" font-size="14" fill="#e6f1fb">SmithDB Ingestion</text>
    <text x="772" y="295" font-size="12.5" fill="#c9dcf0">(newest segments)</text>
    <text x="772" y="317" font-size="11" fill="#8a9bb4">langsmith-smithdb-ingestion</text>

    <circle cx="1260" cy="165" r="72" fill="#2e3800" stroke="#8aa61a" stroke-width="2"/>
    <text x="1260" y="159" text-anchor="middle" font-size="14" fill="#e4f59a">Object</text>
    <text x="1260" y="179" text-anchor="middle" font-size="14" fill="#e4f59a">Storage</text>
    <text x="1260" y="199" text-anchor="middle" font-size="11" fill="#8a9bb4">(segments)</text>

    <path d="M240 152 H328" marker-end="url(#g)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <circle cx="284" cy="132" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="284" y="136" text-anchor="middle" font-size="12" fill="#7cc4fa">1</text>
    <path d="M630 128 H700 V67 H758" marker-end="url(#g)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <text x="690" y="82" text-anchor="end" font-size="12" fill="#8a9bb4">segment list</text>
    <circle cx="700" cy="97" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="700" y="101" text-anchor="middle" font-size="12" fill="#7cc4fa">2</text>
    <path d="M480 214 V263" marker-end="url(#g)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <text x="516" y="244" font-size="12" fill="#8a9bb4">cache hit</text>
    <circle cx="500" cy="240" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="500" y="244" text-anchor="middle" font-size="12" fill="#7cc4fa">3</text>
    <path d="M630 165 H1186" marker-end="url(#g)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <text x="900" y="158" text-anchor="middle" font-size="12" fill="#8a9bb4">cache miss</text>
    <circle cx="1100" cy="145" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="1100" y="149" text-anchor="middle" font-size="12" fill="#7cc4fa">4</text>
    <path d="M630 200 H700 V287 H758" marker-end="url(#g)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <text x="690" y="230" text-anchor="end" font-size="12" fill="#8a9bb4">newest data</text>
    <circle cx="700" cy="245" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="700" y="249" text-anchor="middle" font-size="12" fill="#7cc4fa">5</text>
    <path d="M328 185 H242" marker-end="url(#g)" stroke="#7cc4fa" stroke-width="1.75" fill="none" stroke-dasharray="6 6"/>
    <circle cx="284" cy="205" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="284" y="209" text-anchor="middle" font-size="12" fill="#7cc4fa">6</text>
    <text x="284" y="238" text-anchor="middle" font-size="12" fill="#8a9bb4">result</text>
  
</svg>
