<svg xmlns="http://www.w3.org/2000/svg" id="diagram" style="color-scheme: dark" width="1380" height="400" viewBox="0 0 1380 400" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">SmithDB feedback path</title>
  <desc id="desc">The platform backend adds feedback to the Redis feedback queue. An ingest queue worker sends it to the SmithDB mutations pool, which stores it in the metastore. Compaction later writes it to object storage.</desc>

    <defs>
      <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7cc4fa" stroke-width="1.8"/></marker>
    </defs>
    <rect x="0" y="0" width="1380" height="400" rx="16" fill="#03070f"/>

    <rect x="30" y="90" width="230" height="84" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <line x1="30" y1="118" x2="260" y2="118" stroke="#7cc4fa" stroke-width="1.5"/>
    <text x="145" y="109" text-anchor="middle" font-size="14" fill="#e6f1fb">Platform Backend</text>
    <text x="42" y="140" font-size="12.5" fill="#c9dcf0">Go API (feedback writes)</text>
    <text x="42" y="162" font-size="11" fill="#8a9bb4">langsmith-platform-backend</text>

    <rect x="320" y="90" width="170" height="84" rx="10" fill="#2e3800" stroke="#8aa61a" stroke-width="2"/>
    <text x="405" y="122" text-anchor="middle" font-size="14" fill="#e4f59a">Redis</text>
    <text x="405" y="144" text-anchor="middle" font-size="12.5" fill="#e4f59a">(feedback queue)</text>

    <rect x="550" y="90" width="210" height="84" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <line x1="550" y1="118" x2="760" y2="118" stroke="#7cc4fa" stroke-width="1.5"/>
    <text x="655" y="109" text-anchor="middle" font-size="14" fill="#e6f1fb">Ingest Queue</text>
    <text x="562" y="140" font-size="12.5" fill="#c9dcf0">workers (feedback)</text>
    <text x="562" y="162" font-size="11" fill="#8a9bb4">langsmith-ingest-queue</text>

    <rect x="820" y="90" width="250" height="84" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <line x1="820" y1="118" x2="1070" y2="118" stroke="#7cc4fa" stroke-width="1.5"/>
    <text x="945" y="109" text-anchor="middle" font-size="14" fill="#e6f1fb">SmithDB Query</text>
    <text x="832" y="140" font-size="12.5" fill="#c9dcf0">mutations (or query)</text>
    <text x="832" y="162" font-size="11" fill="#8a9bb4">langsmith-smithdb-mutations</text>

    <rect x="1150" y="95" width="210" height="74" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <text x="1255" y="126" text-anchor="middle" font-size="14" fill="#e6f1fb">Postgres Metastore</text>
    <text x="1255" y="148" text-anchor="middle" font-size="11" fill="#8a9bb4">(feedback rows)</text>

    <rect x="820" y="258" width="250" height="84" fill="#161f33" stroke="#7cc4fa" stroke-width="2"/>
    <line x1="820" y1="286" x2="1070" y2="286" stroke="#7cc4fa" stroke-width="1.5"/>
    <text x="945" y="277" text-anchor="middle" font-size="14" fill="#e6f1fb">Compaction Worker</text>
    <text x="832" y="308" font-size="12.5" fill="#c9dcf0">feedback compaction</text>
    <text x="832" y="330" font-size="11" fill="#8a9bb4">langsmith-smithdb-compaction-worker</text>

    <circle cx="1270" cy="300" r="72" fill="#2e3800" stroke="#8aa61a" stroke-width="2"/>
    <text x="1270" y="294" text-anchor="middle" font-size="14" fill="#e4f59a">Object</text>
    <text x="1270" y="314" text-anchor="middle" font-size="14" fill="#e4f59a">Storage</text>
    <text x="1270" y="334" text-anchor="middle" font-size="11" fill="#8a9bb4">(feedback files)</text>

    <path d="M260 132 H318" marker-end="url(#h)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <circle cx="289" cy="112" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="289" y="116" text-anchor="middle" font-size="12" fill="#7cc4fa">1</text>
    <path d="M490 132 H548" marker-end="url(#h)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <circle cx="519" cy="112" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="519" y="116" text-anchor="middle" font-size="12" fill="#7cc4fa">2</text>
    <path d="M760 125 H818" marker-end="url(#h)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <circle cx="789" cy="105" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="789" y="109" text-anchor="middle" font-size="12" fill="#7cc4fa">3</text>
    <path d="M1070 132 H1148" marker-end="url(#h)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <text x="1109" y="152" text-anchor="middle" font-size="12" fill="#8a9bb4">row</text>
    <circle cx="1109" cy="112" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="1109" y="116" text-anchor="middle" font-size="12" fill="#7cc4fa">4</text>
    <path d="M820 160 H762" marker-end="url(#h)" stroke="#7cc4fa" stroke-width="1.75" fill="none" stroke-dasharray="6 6"/>
    <circle cx="789" cy="182" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="789" y="186" text-anchor="middle" font-size="12" fill="#7cc4fa">5</text>
    <text x="789" y="215" text-anchor="middle" font-size="12" fill="#8a9bb4">ack</text>
    <path d="M1255 169 V215 H945 V256" marker-end="url(#h)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <circle cx="1100" cy="215" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="1100" y="219" text-anchor="middle" font-size="12" fill="#7cc4fa">6</text>
    <path d="M1070 300 H1194" marker-end="url(#h)" stroke="#7cc4fa" stroke-width="2" fill="none"/>
    <circle cx="1133" cy="280" r="11" fill="#03070f" stroke="#7cc4fa" stroke-width="1.5"/><text x="1133" y="284" text-anchor="middle" font-size="12" fill="#7cc4fa">7</text>
  
</svg>
