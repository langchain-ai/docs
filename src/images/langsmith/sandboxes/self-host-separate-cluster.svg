<svg xmlns="http://www.w3.org/2000/svg" id="diagram" style="color-scheme: light" width="900" height="1004" viewBox="0 0 900 1004" role="img" aria-labelledby="title desc">
  <title id="title">Self-hosted Sandboxes in a separate cluster</title>
  <desc id="desc">Clients reach the platform backend in the LangSmith cluster, which keeps PostgreSQL and the two sandbox secrets. The platform backend calls sandbox-host in the sandbox cluster on TCP port 19190, and sandbox-host calls back over HTTPS to config.endpoint. The sandbox cluster holds copies of the two secrets, uses its own Kubernetes API for Leases, and reaches the JuiceFS Redis and object storage.</desc>
