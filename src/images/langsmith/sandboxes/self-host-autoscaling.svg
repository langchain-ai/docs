<svg xmlns="http://www.w3.org/2000/svg" id="diagram" style="color-scheme: light" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
  <title id="title">Two layers of Sandbox autoscaling</title>
  <desc id="desc">Layer one: hosts publish committed CPU through Leases, an elected host computes the target, and the Deployment creates host pods. Layer two: a pending host needs an eligible node, the node autoscaler provisions one, and the host checks storage before joining the ready pool.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1.34 0.5L10 5L1.34 9.5Z" fill="#40668D"/></marker>
  </defs>
  <g>
    <rect x="16" y="16" width="788" height="184" rx="12" fill="#F2FAFF" stroke="#40668D"/>
    <rect x="34" y="72" width="232" height="104" rx="10" fill="#E5F4FF" stroke="#006DDD" stroke-width="2"/>
    <rect x="294" y="72" width="232" height="104" rx="10" fill="#E5F4FF" stroke="#006DDD" stroke-width="2"/>
    <rect x="554" y="72" width="232" height="104" rx="10" fill="#E5F4FF" stroke="#006DDD" stroke-width="2"/>
    <rect x="16" y="270" width="788" height="184" rx="12" fill="#F6FFDB" stroke="#6E8900"/>
    <rect x="34" y="326" width="232" height="104" rx="10" fill="#F2FAFF" stroke="#6E8900" stroke-width="2"/>
    <rect x="294" y="326" width="232" height="104" rx="10" fill="#F2FAFF" stroke="#6E8900" stroke-width="2"/>
    <rect x="554" y="326" width="232" height="104" rx="10" fill="#F2FAFF" stroke="#6E8900" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#40668D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M266 124H288"/>
    <path d="M526 124H548"/>
    <path d="M670 176V235H150V320"/>
    <path d="M266 378H288"/>
    <path d="M526 378H548"/>
  </g>
  <g id="labels" font-family="TWK Lausanne, Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#030710">
    <text x="40" y="47" fill="#1A5EAA">Layer 1, LangSmith host autoscaler</text>
    <text x="150" y="106.07" text-anchor="middle" font-size="17" font-weight="600">Hosts report load</text>
    <text x="150" y="130.07" text-anchor="middle">Committed vCPU</text>
    <text x="150" y="154.07" text-anchor="middle">Kubernetes Leases</text>
    <text x="410" y="106.07" text-anchor="middle" font-size="17" font-weight="600">Leader sizes pool</text>
    <text x="410" y="130.07" text-anchor="middle">Target + headroom</text>
    <text x="410" y="154.07" text-anchor="middle">Clamp to min / max</text>
    <text x="670" y="106.07" text-anchor="middle" font-size="17" font-weight="600">Deployment scales</text>
    <text x="670" y="130.07" text-anchor="middle">Desired host replicas</text>
    <text x="670" y="154.07" text-anchor="middle">New pods need nodes</text>
    <text x="170" y="301" fill="#2E3900">Layer 2, your node autoscaler</text>
    <text x="150" y="360.07" text-anchor="middle" font-size="17" font-weight="600">Host pod is Pending</text>
    <text x="150" y="384.07" text-anchor="middle">No eligible node</text>
    <text x="150" y="408.07" text-anchor="middle">without a host</text>
    <text x="410" y="360.07" text-anchor="middle" font-size="17" font-weight="600">Provision a node</text>
    <text x="410" y="384.07" text-anchor="middle">KVM-capable pool</text>
    <text x="410" y="408.07" text-anchor="middle">Limits and quota apply</text>
    <text x="670" y="360.07" text-anchor="middle" font-size="17" font-weight="600">Host becomes ready</text>
    <text x="670" y="384.07" text-anchor="middle">Mount and check storage</text>
    <text x="670" y="408.07" text-anchor="middle">Accept placements</text>
  </g>
</svg>
