<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="title desc">
  <title id="title">Scaling responds differently to rising and falling demand</title>
  <desc id="desc">A qualitative chart, not a benchmark. The load-based host target rises first, then ready hosts catch up as nodes start. When demand falls, the autoscaler holds the peak before reducing its replica target one host per stabilization window.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#40668D"/></marker></defs>
  <rect width="820" height="400" rx="16" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#030710">
    <rect x="468" y="75" width="124" height="216" fill="#FDF3FF"/>
    <path d="M72 73 V292 H778" fill="none" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="30" y="190" transform="rotate(-90 30 190)" text-anchor="middle" fill="#2F4B68">Host count</text>
    <text x="779" y="317" text-anchor="end" fill="#2F4B68">Time</text>
    <path d="M72 256 H192 V120 H468 V256 H768" fill="none" stroke="#6E8900" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M72 252 H192 V116 H592 V151 H644 V186 H696 V221 H748 V252 H768" fill="none" stroke="#006DDD" stroke-width="3"/>
    <path d="M72 248 H240 V213 H270 V178 H300 V143 H330 V112 H610 V147 H662 V182 H714 V217 H765 V248" fill="none" stroke="#885270" stroke-width="3"/>
    <text x="234" y="45" font-weight="700" fill="#006DDD">Provisioning delay</text>
    <path d="M260 54 V88" stroke="#40668D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="530" y="49" text-anchor="middle" font-weight="700" fill="#504B5F">Hold peak</text>
    <text x="530" y="68" text-anchor="middle" font-size="13" fill="#504B5F">Stabilization window</text>
    <text x="654" y="89" font-weight="700" fill="#006DDD">Gradual scale-down</text>
    <path d="M698 96 V171" stroke="#40668D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="191" y="316" text-anchor="middle">Demand rises</text>
    <text x="468" y="316" text-anchor="middle">Demand falls</text>
    <path d="M74 356 H113" stroke="#6E8900" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="124" y="361">Load-based target</text>
    <path d="M319 356 H358" stroke="#006DDD" stroke-width="3"/>
    <text x="369" y="361">Replica target</text>
    <path d="M565 356 H604" stroke="#885270" stroke-width="3"/>
    <text x="615" y="361">Ready hosts</text>
  </g>
</svg>
