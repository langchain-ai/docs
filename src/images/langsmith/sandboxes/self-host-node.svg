<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 630" role="img" aria-labelledby="title desc">
  <title id="title">Inside one sandbox node</title>
  <desc id="desc">A dedicated Kubernetes node contains a privileged sandbox-host pod. The daemon manages multiple Firecracker microVMs with separate kernels and guest agents. A host-owned JuiceFS client connects their disk and saved-memory images to shared storage outside the node. KVM and a disposable cache are node resources.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#40668D"/></marker></defs>
  <rect width="820" height="630" rx="16" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#030710">
    <rect x="20" y="20" width="780" height="520" rx="14" fill="#F2FAFF" stroke="#40668D"/>
    <text x="42" y="52" font-size="14" font-weight="700" fill="#2F4B68">DEDICATED KUBERNETES NODE · KVM AVAILABLE</text>
    <rect x="40" y="72" width="740" height="355" rx="12" fill="#FFFFFF" stroke="#B27D75" stroke-width="2"/>
    <text x="60" y="101" font-size="14" font-weight="700" fill="#634643">SANDBOX-HOST POD · PRIVILEGED · HOST NETWORK</text>
    <rect x="62" y="124" width="696" height="64" rx="8" fill="#E5F4FF" stroke="#006DDD" stroke-width="2"/>
    <text x="410" y="151" text-anchor="middle" font-weight="700">sandbox-host daemon</text>
    <text x="410" y="175" text-anchor="middle">Lifecycle · traffic proxy · health · idle stop</text>
    <path d="M240 188 V222 M580 188 V222" fill="none" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="62" y="224" width="330" height="106" rx="9" fill="#F8E8E6" stroke="#B27D75" stroke-width="2"/>
    <text x="227" y="252" text-anchor="middle" font-weight="700">Firecracker microVM A</text>
    <text x="227" y="279" text-anchor="middle">Guest kernel · guest agent</text>
    <text x="227" y="306" text-anchor="middle" fill="#634643">Guest memory · filesystem</text>
    <rect x="428" y="224" width="330" height="106" rx="9" fill="#F8E8E6" stroke="#B27D75" stroke-width="2"/>
    <text x="593" y="252" text-anchor="middle" font-weight="700">Firecracker microVM B</text>
    <text x="593" y="279" text-anchor="middle">Guest kernel · guest agent</text>
    <text x="593" y="306" text-anchor="middle" fill="#634643">Guest memory · filesystem</text>
    <path d="M227 330 V357 M593 330 V357" stroke="#885270" stroke-width="2"/>
    <rect x="62" y="358" width="696" height="47" rx="8" fill="#EBD0F0" stroke="#885270" stroke-width="2"/>
    <text x="410" y="388" text-anchor="middle" fill="#441E33">JuiceFS client: shared disk and saved-memory images</text>
    <path d="M636 405 V562 M378 405 V462" fill="none" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="62" y="464" width="180" height="49" rx="8" fill="#FFFFFF" stroke="#40668D"/>
    <text x="152" y="495" text-anchor="middle" font-weight="700">/dev/kvm</text>
    <rect x="276" y="464" width="205" height="49" rx="8" fill="#FFFFFF" stroke="#40668D"/>
    <text x="378" y="495" text-anchor="middle">Disposable local cache</text>
    <rect x="514" y="564" width="244" height="49" rx="8" fill="#EBD0F0" stroke="#885270"/>
    <text x="636" y="595" text-anchor="middle" fill="#441E33">Shared Redis + object store</text>
  </g>
</svg>
