<svg xmlns="http://www.w3.org/2000/svg" id="diagram" style="color-scheme: light" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">One-host-at-a-time rolling upgrade</title>
  <desc id="desc">In an otherwise healthy four-host pool, hosts drain and start the new version sequentially. Three hosts remain ready during each replacement. All four are ready on the new version at the end. Segment widths are illustrative, not measured durations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1.34 0.5L10 5L1.34 9.5Z" fill="#40668D"/></marker>
  </defs>
  <g stroke-width="1">
    <path d="M255 56V302M400 56V302M545 56V302M690 56V302" fill="none" stroke="#CCE9FF"/>
    <rect x="110" y="66" width="100" height="42" rx="4" fill="#F8E8E6" stroke="#634643"/>
    <rect x="210" y="66" width="45" height="42" rx="4" fill="#FDF3FF" stroke="#7E65AE"/>
    <rect x="255" y="66" width="520" height="42" rx="4" fill="#CCE9FF" stroke="#006DDD"/>
    <rect x="110" y="124" width="145" height="42" rx="4" fill="#F2FAFF" stroke="#40668D"/>
    <rect x="255" y="124" width="100" height="42" rx="4" fill="#F8E8E6" stroke="#634643"/>
    <rect x="355" y="124" width="45" height="42" rx="4" fill="#FDF3FF" stroke="#7E65AE"/>
    <rect x="400" y="124" width="375" height="42" rx="4" fill="#CCE9FF" stroke="#006DDD"/>
    <rect x="110" y="182" width="290" height="42" rx="4" fill="#F2FAFF" stroke="#40668D"/>
    <rect x="400" y="182" width="100" height="42" rx="4" fill="#F8E8E6" stroke="#634643"/>
    <rect x="500" y="182" width="45" height="42" rx="4" fill="#FDF3FF" stroke="#7E65AE"/>
    <rect x="545" y="182" width="230" height="42" rx="4" fill="#CCE9FF" stroke="#006DDD"/>
    <rect x="110" y="240" width="435" height="42" rx="4" fill="#F2FAFF" stroke="#40668D"/>
    <rect x="545" y="240" width="100" height="42" rx="4" fill="#F8E8E6" stroke="#634643"/>
    <rect x="645" y="240" width="45" height="42" rx="4" fill="#FDF3FF" stroke="#7E65AE"/>
    <rect x="690" y="240" width="85" height="42" rx="4" fill="#CCE9FF" stroke="#006DDD"/>
    <rect x="111" y="382" width="22" height="18" rx="3" fill="#F8E8E6" stroke="#634643"/>
    <rect x="371" y="382" width="22" height="18" rx="3" fill="#FDF3FF" stroke="#7E65AE"/>
    <rect x="636" y="382" width="22" height="18" rx="3" fill="#CCE9FF" stroke="#006DDD"/>
  </g>
  <path d="M110 312H781" fill="none" stroke="#40668D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g id="labels" font-family="TWK Lausanne, Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#030710">
    <text x="110" y="38" fill="#1A5EAA">Drain → start → ready, then the next host</text>
    <text x="24" y="92.71">Host 1</text>
    <text x="160" y="92.71" text-anchor="middle" fill="#634643">Drain</text>
    <text x="515" y="92.71" text-anchor="middle">New version</text>
    <text x="24" y="150.71">Host 2</text>
    <text x="182.5" y="150.71" text-anchor="middle" fill="#2F4B68">Old version</text>
    <text x="305" y="150.71" text-anchor="middle" fill="#634643">Drain</text>
    <text x="587.5" y="150.71" text-anchor="middle">New version</text>
    <text x="24" y="208.71">Host 3</text>
    <text x="255" y="208.71" text-anchor="middle" fill="#2F4B68">Old version</text>
    <text x="450" y="208.71" text-anchor="middle" fill="#634643">Drain</text>
    <text x="660" y="208.71" text-anchor="middle">New version</text>
    <text x="24" y="266.71">Host 4</text>
    <text x="327.5" y="266.71" text-anchor="middle" fill="#2F4B68">Old version</text>
    <text x="595" y="266.71" text-anchor="middle" fill="#634643">Drain</text>
    <text x="732.5" y="266.71" text-anchor="middle">New</text>
    <text x="182.5" y="340" text-anchor="middle" fill="#2F4B68">3 of 4 ready</text>
    <text x="327.5" y="340" text-anchor="middle" fill="#2F4B68">3 of 4 ready</text>
    <text x="472.5" y="340" text-anchor="middle" fill="#2F4B68">3 of 4 ready</text>
    <text x="617.5" y="340" text-anchor="middle" fill="#2F4B68">3 of 4 ready</text>
    <text x="732.5" y="340" text-anchor="middle" fill="#2F4B68">4 of 4</text>
    <text x="144" y="396.71">Save memory and stop</text>
    <text x="404" y="396.71">Start and check storage</text>
    <text x="669" y="396.71">Ready</text>
  </g>
</svg>
