<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">One-host-at-a-time rolling upgrade</title>
  <desc id="desc">In an otherwise healthy four-host pool, hosts drain and start the new version sequentially. Three hosts remain ready during each replacement. All four are ready on the new version at the end. Segment widths are illustrative, not measured durations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#40668D"/></marker>
    <pattern id="drain" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F8E8E6"/><path d="M0 8 L8 0" stroke="#B27D75" stroke-width="1"/></pattern>
  </defs>
  <rect width="820" height="430" rx="16" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#030710">
    <text x="110" y="36" font-size="14" font-weight="700" fill="#2F4B68">DRAIN → START → READY, THEN THE NEXT HOST</text>
    <g stroke="#40668D" stroke-dasharray="4 5" opacity="0.4">
      <path d="M255 59 V310 M400 59 V310 M545 59 V310 M690 59 V310"/>
    </g>
    <text x="30" y="98">Host 1</text>
    <rect x="110" y="72" width="100" height="42" rx="4" fill="url(#drain)" stroke="#B27D75"/>
    <rect x="210" y="72" width="45" height="42" rx="4" fill="#FDF3FF" stroke="#7E65AE"/>
    <rect x="255" y="72" width="520" height="42" rx="4" fill="#E5F4FF" stroke="#006DDD"/>
    <text x="160" y="98" text-anchor="middle" fill="#634643">Drain</text>
    <text x="515" y="98" text-anchor="middle">New version</text>
    <text x="30" y="156">Host 2</text>
    <rect x="110" y="130" width="145" height="42" rx="4" fill="#F2FAFF" stroke="#40668D"/>
    <rect x="255" y="130" width="100" height="42" rx="4" fill="url(#drain)" stroke="#B27D75"/>
    <rect x="355" y="130" width="45" height="42" rx="4" fill="#FDF3FF" stroke="#7E65AE"/>
    <rect x="400" y="130" width="375" height="42" rx="4" fill="#E5F4FF" stroke="#006DDD"/>
    <text x="182" y="156" text-anchor="middle" fill="#2F4B68">Old version</text>
    <text x="305" y="156" text-anchor="middle" fill="#634643">Drain</text>
    <text x="587" y="156" text-anchor="middle">New version</text>
    <text x="30" y="214">Host 3</text>
    <rect x="110" y="188" width="290" height="42" rx="4" fill="#F2FAFF" stroke="#40668D"/>
    <rect x="400" y="188" width="100" height="42" rx="4" fill="url(#drain)" stroke="#B27D75"/>
    <rect x="500" y="188" width="45" height="42" rx="4" fill="#FDF3FF" stroke="#7E65AE"/>
    <rect x="545" y="188" width="230" height="42" rx="4" fill="#E5F4FF" stroke="#006DDD"/>
    <text x="255" y="214" text-anchor="middle" fill="#2F4B68">Old version</text>
    <text x="450" y="214" text-anchor="middle" fill="#634643">Drain</text>
    <text x="660" y="214" text-anchor="middle">New version</text>
    <text x="30" y="272">Host 4</text>
    <rect x="110" y="246" width="435" height="42" rx="4" fill="#F2FAFF" stroke="#40668D"/>
    <rect x="545" y="246" width="100" height="42" rx="4" fill="url(#drain)" stroke="#B27D75"/>
    <rect x="645" y="246" width="45" height="42" rx="4" fill="#FDF3FF" stroke="#7E65AE"/>
    <rect x="690" y="246" width="85" height="42" rx="4" fill="#E5F4FF" stroke="#006DDD"/>
    <text x="327" y="272" text-anchor="middle" fill="#2F4B68">Old version</text>
    <text x="595" y="272" text-anchor="middle" fill="#634643">Drain</text>
    <text x="732" y="272" text-anchor="middle">New</text>
    <path d="M110 315 H777" fill="none" stroke="#40668D" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="182" y="340" text-anchor="middle" fill="#2F4B68">3 of 4 ready</text>
    <text x="327" y="340" text-anchor="middle" fill="#2F4B68">3 of 4 ready</text>
    <text x="472" y="340" text-anchor="middle" fill="#2F4B68">3 of 4 ready</text>
    <text x="617" y="340" text-anchor="middle" fill="#2F4B68">3 of 4 ready</text>
    <text x="732" y="340" text-anchor="middle" fill="#006DDD">4 of 4</text>
    <rect x="111" y="379" width="22" height="18" rx="3" fill="url(#drain)" stroke="#B27D75"/>
    <text x="144" y="394">Save memory and stop</text>
    <rect x="371" y="379" width="22" height="18" rx="3" fill="#FDF3FF" stroke="#7E65AE"/>
    <text x="404" y="394">Start and check storage</text>
    <rect x="636" y="379" width="22" height="18" rx="3" fill="#E5F4FF" stroke="#006DDD"/>
    <text x="669" y="394">Ready</text>
  </g>
</svg>
