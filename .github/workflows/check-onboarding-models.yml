---
name: Check onboarding snippet models

# The LangSmith UI's tracing quickstart ships its own code snippets from
# langchainplus. This reports model IDs in them that the docs no longer use,
# on one standing issue in this repo. It never edits langchainplus.

on:
  schedule:
    # Mondays at 08:30 UTC, after the external version refresh.
    - cron: "30 8 * * 1"
  workflow_dispatch: {}

jobs:
  check:
    name: Outdated models in onboarding snippets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13 + uv
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.13"

      - name: Compare snippet models to the docs defaults
        id: check
        env:
          # Read-only access to langchainplus contents.
          GH_TOKEN: ${{ secrets.LANGCHAINPLUS_READ_TOKEN }}
        run: |
          set +e
          uv run python scripts/check_onboarding_models.py \
            --output "$RUNNER_TEMP/report.md"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ge 2 ]; then
            echo "::error::Could not read the onboarding snippets from langchainplus"
            exit 1
          fi
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update, or close the standing issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          set -euo pipefail

          TITLE="Outdated models in LangSmith onboarding snippets"
          ISSUE="$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" |
            head -n 1)"

          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "Fix these in langchainplus, then this issue closes on the next weekly run."
            echo "Generated by \`.github/workflows/check-onboarding-models.yml\` on $(date -u +"%Y-%m-%d")."
          } > "$RUNNER_TEMP/body.md"

          if [ "$STATUS" = "0" ]; then
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" --comment "Every onboarding snippet model is current."
            fi
            exit 0
          fi

          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
