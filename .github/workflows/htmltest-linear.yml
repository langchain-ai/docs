---
name: Htmltest Linear Ticket

permissions:
  contents: read

# Filed separately so manual workflow_dispatch runs do not require a Linear
# ticket unless they also came from the weekly schedule.
on:
  workflow_run:
    workflows: ["Htmltest Mint Export"]
    types: [completed]

jobs:
  create-linear-ticket:
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Create Linear issue
        uses: ctriolo/action-create-linear-issue@699c7c2f0639181e0eaf5622d2987c6584f48a5a # v0.7
        with:
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          linear-team-key: ${{ vars.LINEAR_TEAM_KEY }}
          linear-issue-title: >-
            ${{ github.event.workflow_run.conclusion == 'cancelled'
              && 'Weekly htmltest timed out'
              || 'Weekly htmltest failed' }}
          linear-issue-description: |
            The scheduled weekly Mintlify export external-URL check (`make export-htmltest`) did not complete successfully.

            **Outcome:** ${{ github.event.workflow_run.conclusion == 'cancelled' && 'Timed out before the export or htmltest finished. Consider increasing the job timeout or reducing export scope.' || 'Build, mint export, or htmltest reported one or more failures (external URLs only; see htmltest-mint-export.yml).' }}

            **Workflow run:** ${{ github.event.workflow_run.html_url }}

            Please investigate and fix the failing links or export step.
          linear-attachment-url: ${{ github.event.workflow_run.html_url }}
          linear-attachment-title: "Failed workflow run"
