---
name: Check for External Doc Links

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "scripts/check-legacy-doc-links.sh"
      - ".github/workflows/check-external-doc-links.yml"

jobs:
  check-external-doc-links:
    name: Block links to old doc sites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check for links to retired doc sites
        run: bash scripts/check-legacy-doc-links.sh
