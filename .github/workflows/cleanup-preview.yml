---
name: Cleanup Preview
run-name: Cleanup preview for PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest

    # Skip for PRs from forks - they don't have write access
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Delete preview branch
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          PREVIEW_BRANCH="preview-pr-${PR_NUM}"

          # Check if preview branch exists
          if git ls-remote --exit-code --heads origin "$PREVIEW_BRANCH" >/dev/null 2>&1; then
            echo "Deleting preview branch: $PREVIEW_BRANCH"
            git push origin --delete "$PREVIEW_BRANCH"
            echo "✅ Preview branch deleted successfully"
          else
            echo "ℹ️ No preview branch found (${PREVIEW_BRANCH})"
          fi

      - name: Comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const previewBranch = `preview-pr-${prNum}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Preview Cleaned Up 🧹

            The preview branch \`${previewBranch}\` has been deleted.

            The Mintlify preview deployment will be automatically removed.`
            });
