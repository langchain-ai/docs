name: Request Fork PR Preview

# A repository owner or member can comment `/preview` on a fork PR. The PR
# code is built in a read-only job; only the separate publish job gets write
# access and Mintlify secrets.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: fork-preview-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare-preview:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/preview' &&
      contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.pr.outputs.authorized }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Validate the request and read the pull request head
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const pullNumber = context.payload.issue.number;
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pull.state !== 'open') {
              core.setFailed('The pull request must be open to create a preview.');
              return;
            }
            if (pull.base.repo.full_name.toLowerCase() !== `${context.repo.owner}/${context.repo.repo}`.toLowerCase()) {
              core.setFailed('The pull request targets a different repository.');
              return;
            }
            if (!pull.head.repo) {
              core.setFailed('The pull request source repository is unavailable.');
              return;
            }
            if (pull.head.repo.full_name.toLowerCase() === pull.base.repo.full_name.toLowerCase()) {
              core.setFailed('Use the regular preview workflow for branches in this repository.');
              return;
            }

            core.setOutput('authorized', 'true');
            core.setOutput('pr_number', String(pull.number));
            core.setOutput('head_sha', pull.head.sha);

  build-preview:
    needs: prepare-preview
    if: needs.prepare-preview.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the requested pull request revision
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ needs.prepare-preview.outputs.pr_number }}/head
          persist-credentials: false
          fetch-depth: 1

      - name: Verify the revision has not changed
        env:
          EXPECTED_SHA: ${{ needs.prepare-preview.outputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: make install

      - name: Build documentation
        run: make build

      - name: Upload built documentation
        uses: actions/upload-artifact@v4
        with:
          name: fork-pr-docs-build
          path: build/
          if-no-files-found: error
          retention-days: 1

  publish-preview:
    needs: [prepare-preview, build-preview]
    if: >-
      needs.prepare-preview.outputs.authorized == 'true' &&
      needs.build-preview.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This job handles untrusted files as data only. It never runs PR code.
      - name: Check out the requested pull request revision
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ needs.prepare-preview.outputs.pr_number }}/head
          fetch-depth: 1

      - name: Verify the revision has not changed
        env:
          EXPECTED_SHA: ${{ needs.prepare-preview.outputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download built documentation
        uses: actions/download-artifact@v4
        with:
          name: fork-pr-docs-build
          path: build

      - name: Push preview branch
        id: branch
        env:
          PR_NUMBER: ${{ needs.prepare-preview.outputs.pr_number }}
          SOURCE_SHA: ${{ needs.prepare-preview.outputs.head_sha }}
        run: |
          set -euo pipefail
          PREVIEW_BRANCH="preview-pr${PR_NUMBER}-${SOURCE_SHA:0:7}-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$PREVIEW_BRANCH"
          git add -f build/
          git commit -m "Add built docs preview for PR #${PR_NUMBER}"
          git push origin "$PREVIEW_BRANCH"
          echo "preview_branch=$PREVIEW_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Trigger Mintlify preview and comment on the pull request
        uses: actions/github-script@v8
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          MINTLIFY_PROJECT_ID: ${{ secrets.MINTLIFY_PROJECT_ID }}
          PREVIEW_BRANCH: ${{ steps.branch.outputs.preview_branch }}
          PR_NUMBER: ${{ needs.prepare-preview.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const apiKey = process.env.MINTLIFY_API_KEY;
            const projectId = process.env.MINTLIFY_PROJECT_ID;
            const branch = process.env.PREVIEW_BRANCH;
            const pullNumber = Number(process.env.PR_NUMBER);

            if (!apiKey || !projectId || !branch) {
              core.setFailed('Mintlify preview configuration or preview branch is missing.');
              return;
            }

            const response = await fetch(`https://api.mintlify.com/v1/project/preview/${projectId}`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${apiKey}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ branch }),
            });
            const result = await response.json();
            if (!response.ok || result.error) {
              core.setFailed(`Mintlify preview request failed with status ${response.status}.`);
              return;
            }

            const lines = [
              '<!-- mintlify-docs-preview -->',
              `Mintlify preview branch generated: \`${branch}\``,
            ];
            if (result.previewUrl) {
              lines.push('', `Site preview: ${result.previewUrl}`);
              lines.push('', '> Preview links may take a few minutes to start working while deployment finishes.');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            for (const comment of comments) {
              if (comment.user?.type === 'Bot' && comment.body?.includes('<!-- mintlify-docs-preview -->')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              body: lines.join('\n'),
            });

  cleanup-preview-branches:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the target repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete preview branches for the closed pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin
          BRANCHES=$(git branch -r | grep -F "origin/preview-pr${PR_NUMBER}-" | sed 's|origin/||' || true)
          if [ -z "$BRANCHES" ]; then
            echo "No fork preview branches found for PR #${PR_NUMBER}"
            exit 0
          fi

          for branch in $BRANCHES; do
            if [[ ! "$branch" =~ ^preview-pr${PR_NUMBER}-[a-f0-9]{7}-[0-9]+$ ]]; then
              echo "Refusing to delete unexpected branch name: $branch"
              exit 1
            fi
            git push origin --delete "$branch"
          done
