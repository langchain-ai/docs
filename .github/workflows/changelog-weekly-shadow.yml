---
name: Weekly changelog (shadow)

# Writes the weekly LangSmith Cloud and Fleet changelog from merged langchainplus
# PRs, without fragments, and opens a draft PR to compare against the fragment-based
# weekly PR. Shadow mode: do not merge these PRs.

on:
  schedule:
    # Mondays at 14:00 UTC, after the fragment-based weekly agent runs.
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: "Window start (YYYY-MM-DD). Leave empty for the week that ended on the last Monday."
        required: false
      until:
        description: "Window end (YYYY-MM-DD). Set together with since."
        required: false

concurrency:
  group: changelog-weekly-shadow
  cancel-in-progress: false

jobs:
  shadow:
    name: Write the shadow changelog
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.13 + uv
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.13"

      - name: Validate the window
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        run: |
          set -euo pipefail
          for value in "$SINCE" "$UNTIL"; do
            if [ -n "$value" ] && ! [[ "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::Dates must be YYYY-MM-DD, got '$value'"
              exit 1
            fi
          done
          if { [ -n "$SINCE" ] && [ -z "$UNTIL" ]; } || { [ -z "$SINCE" ] && [ -n "$UNTIL" ]; }; then
            echo "::error::Set both since and until, or neither"
            exit 1
          fi

      - name: Run the pipeline
        env:
          # Read-only access to langchainplus PRs.
          GH_TOKEN: ${{ secrets.LANGCHAINPLUS_READ_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EPPO_API_KEY: ${{ secrets.EPPO_API_KEY }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        run: |
          set -euo pipefail
          window=()
          if [ -n "$SINCE" ]; then window=(--since "$SINCE" --until "$UNTIL"); fi
          uv run python scripts/changelog_pipeline.py weekly \
            --out "$RUNNER_TEMP/changelog" "${window[@]}" --write \
            > "$RUNNER_TEMP/review-path.txt"

      - name: Lint the entries
        id: vale
        continue-on-error: true
        run: |
          set -o pipefail
          make lint_prose FILES="src/langsmith/changelog.mdx src/snippets/langsmith/fleet-changelog.mdx" \
            2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee "$RUNNER_TEMP/vale.txt"

      - name: Open the draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No entries this week" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REVIEW="$(tail -n 1 "$RUNNER_TEMP/review-path.txt")"
          WEEK="$(grep -m1 -oE 'label="[^"]+"' src/langsmith/changelog.mdx | cut -d'"' -f2)"
          BRANCH="changelog/shadow-$(date -u +%Y-%m-%d)"

          {
            echo "Shadow run of the PR-based weekly changelog for **${WEEK}**. Compare it with this week's fragment-based weekly PR. **Do not merge.**"
            echo
            echo "Generated by \`scripts/changelog_pipeline.py weekly\` from merged langchainplus PRs: Haiku classifies each PR, Sonnet groups and writes highlights, Haiku writes the rest."
            echo
            cat "$REVIEW"
            echo
            echo "## Vale"
            echo
            echo '```text'
            tail -n 40 "$RUNNER_TEMP/vale.txt" || true
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/langsmith/changelog.mdx src/snippets/langsmith/fleet-changelog.mdx
          git commit -m "docs(langsmith): shadow weekly changelog for ${WEEK}"
          git push --force origin "$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "docs(langsmith): [shadow] weekly changelog for ${WEEK}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
