---
name: Weekly changelog

# Writes the weekly LangSmith Cloud and Fleet changelog from merged langchainplus PRs
# and opens a PR for review. Replaces the fragment-based Fleet agent.

on:
  schedule:
    # Mondays at 13:00 UTC, for the week that ended that Monday.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: "Window start (YYYY-MM-DD). Leave empty for the week that ended on the last Monday."
        required: false
      until:
        description: "Window end (YYYY-MM-DD). Set together with since."
        required: false
      dry_run:
        description: "Write the entries and reviewer list to the run summary instead of opening a PR."
        type: boolean
        default: false

concurrency:
  group: changelog-weekly
  cancel-in-progress: false

jobs:
  weekly:
    name: Write the weekly changelog
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.13 + uv
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.13"

      - name: Validate the window
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        run: |
          set -euo pipefail
          for value in "$SINCE" "$UNTIL"; do
            if [ -n "$value" ] && ! [[ "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::Dates must be YYYY-MM-DD, got '$value'"
              exit 1
            fi
          done
          if { [ -n "$SINCE" ] && [ -z "$UNTIL" ]; } || { [ -z "$SINCE" ] && [ -n "$UNTIL" ]; }; then
            echo "::error::Set both since and until, or neither"
            exit 1
          fi

      - name: Run the pipeline
        env:
          # Read-only access to langchainplus PRs.
          GH_TOKEN: ${{ secrets.LANGCHAINPLUS_READ_TOKEN }}
          # The repo's Anthropic key is a gateway key; it needs the gateway URL and headers.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: ${{ secrets.ANTHROPIC_CUSTOM_HEADERS }}
          EPPO_API_KEY: ${{ secrets.EPPO_API_KEY }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--out "$RUNNER_TEMP/changelog")
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE" --until "$UNTIL"); fi
          if [ "$DRY_RUN" != "true" ]; then args+=(--write); fi
          uv run python scripts/changelog_pipeline.py weekly "${args[@]}" \
            > "$RUNNER_TEMP/review-path.txt"
          # This repository is public: the summary shows only what would publish. The
          # reviewer list names private PRs and unreleased work, so it goes to Notion.
          if [ "$DRY_RUN" = "true" ]; then
            REVIEW="$(tail -n 1 "$RUNNER_TEMP/review-path.txt")"
            {
              echo "## Entries"
              echo
              echo '```mdx'
              cat "$(dirname "$REVIEW")/mock.mdx"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lint the entries
        if: ${{ inputs.dry_run != true }}
        id: vale
        continue-on-error: true
        run: |
          set -o pipefail
          make lint_prose FILES="src/langsmith/changelog.mdx src/snippets/langsmith/fleet-changelog.mdx" \
            2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee "$RUNNER_TEMP/vale.txt"

      - name: Open the PR
        if: ${{ inputs.dry_run != true }}
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No entries this week" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REVIEW="$(tail -n 1 "$RUNNER_TEMP/review-path.txt")"
          WEEK="$(cat "$(dirname "$REVIEW")/label.txt")"
          BRANCH="changelog/weekly-$(date -u +%Y-%m-%d)"

          # Never put the reviewer list here: this repository is public, and the list
          # names private PRs and unreleased work. The next step links the Notion page.
          {
            echo "Weekly LangSmith Cloud and Fleet changelog for **${WEEK}**, generated by \`scripts/changelog_pipeline.py weekly\` from merged langchainplus PRs."
            echo
            echo "> [!IMPORTANT]"
            echo "> **Needs human review before merging.** The workflow is creating the Notion review page. If this note does not change to a link, the Notion step failed: see the workflow run."
          } > "$RUNNER_TEMP/pr-body.md"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/langsmith/changelog.mdx src/snippets/langsmith/fleet-changelog.mdx \
            scripts/.changelog_held.json scripts/.changelog_review.json
          git commit -m "docs(langsmith): weekly changelog for ${WEEK}"
          git push --force origin "$BRANCH"
          # A rerun after a failed Notion step reuses the open PR.
          PR_URL="$(gh pr create --base main --head "$BRANCH" \
            --title "docs(langsmith): weekly changelog for ${WEEK}" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            || gh pr view "$BRANCH" --json url --jq .url)"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      # Fails the run if Notion is unreachable, so a missing review page is noticed.
      - name: Create the Notion review page
        if: ${{ inputs.dry_run != true && steps.pr.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          uv run python scripts/changelog_pipeline.py review-notion \
            --pr-url "$PR_URL" --body-out "$RUNNER_TEMP/pr-body-notion.md"
          {
            echo
            echo "## Vale"
            echo
            echo '```text'
            tail -n 40 "$RUNNER_TEMP/vale.txt" || true
            echo '```'
          } >> "$RUNNER_TEMP/pr-body-notion.md"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_URL##*/}" \
            -F "body=@$RUNNER_TEMP/pr-body-notion.md" > /dev/null
