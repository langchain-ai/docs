# When a docs-team member is assigned to a PR, they own its review: remove
# pending review requests for the other docs-team members so the PR leaves
# their review queues. The docs team is the `# docs-team:` line in
# .github/OWNERS. Requests for anyone outside the docs team, such as an
# engineer asked to check accuracy, are left alone.
#
# NOTE: This uses `pull_request_target` so it can edit review requests on
# PRs from forks. The script only reads OWNERS from the base branch and the
# PR's review requests — no untrusted code is executed.

name: Review Ownership

on:
  pull_request_target:
    types: [assigned]

jobs:
  clear-other-requests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Remove other docs-team review requests
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const assignee = context.payload.assignee?.login;
            if (!assignee) return;

            // --- Read the docs team from OWNERS on the base branch ---
            let ownersContent;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo,
                path: '.github/OWNERS',
                ref: pr.base.ref
              });
              ownersContent = Buffer.from(data.content, 'base64').toString();
            } catch (error) {
              console.log('Could not read .github/OWNERS:', error.message);
              return;
            }

            const docsTeam = new Set();
            for (const line of ownersContent.split('\n')) {
              const m = line.trim().match(/^#\s*docs-team:\s*(.*)$/i);
              if (!m) continue;
              for (const t of m[1].split(/[\s,]+/)) {
                if (t.startsWith('@')) docsTeam.add(t.slice(1).toLowerCase());
              }
            }

            if (!docsTeam.has(assignee.toLowerCase())) {
              console.log(`@${assignee} is not on the docs team; nothing to do`);
              return;
            }

            // --- Drop pending requests for the rest of the docs team ---
            // Re-fetch: the payload's requested_reviewers can be stale when
            // several events land together.
            const { data: current } = await github.rest.pulls.get({
              owner, repo, pull_number: pr.number
            });
            const toRemove = (current.requested_reviewers || [])
              .map(r => r.login)
              .filter(login =>
                docsTeam.has(login.toLowerCase()) &&
                login.toLowerCase() !== assignee.toLowerCase()
              );

            if (toRemove.length === 0) {
              console.log(`No other docs-team review requests on PR #${pr.number}`);
              return;
            }

            await github.rest.pulls.removeRequestedReviewers({
              owner, repo,
              pull_number: pr.number,
              reviewers: toRemove
            });
            console.log(
              `@${assignee} owns PR #${pr.number}; removed review requests for ` +
              toRemove.map(u => '@' + u).join(', ')
            );
