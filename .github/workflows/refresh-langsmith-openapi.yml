---
name: Refresh LangSmith OpenAPI spec

on:
  schedule:
    # Daily at 10:00 AM UTC
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    name: Refresh LangSmith Platform API spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.13 + uv
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.13"

      - name: Fetch and process OpenAPI spec
        run: |
          uv run python scripts/process_langsmith_openapi.py --write

      - name: Open or update the refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BRANCH_NAME="chore/refresh-langsmith-openapi"
          SPEC_PATH="src/langsmith/langsmith-platform-openapi.json"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the freshly generated spec, then restore the tree so the
          # branch checkout below is clean.
          cp "$SPEC_PATH" "$RUNNER_TEMP/openapi.json"
          git checkout -- "$SPEC_PATH"

          # Reuse the standing refresh branch when its PR is still open, so
          # daily runs append a commit instead of stacking duplicate PRs.
          PR_NUMBER="$(gh pr list --head "$BRANCH_NAME" --state open \
            --json number --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            echo "Found open PR #$PR_NUMBER on $BRANCH_NAME; appending to it"
            git fetch --depth=1 origin \
              "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            echo "No open PR on $BRANCH_NAME; starting a new one from main"
            git checkout -B "$BRANCH_NAME"
          fi

          cp "$RUNNER_TEMP/openapi.json" "$SPEC_PATH"

          if git diff --quiet -- "$SPEC_PATH"; then
            echo "No changes to commit"
            exit 0
          fi

          git add "$SPEC_PATH"
          git commit -m "$(cat <<EOF
          chore: refresh LangSmith platform OpenAPI spec

          Automated refresh from api.smith.langchain.com with fleet and
          internal endpoints filtered for public documentation.

          Refreshed $(date -u +"%Y-%m-%d %H:%M UTC").
          EOF
          )"

          if [ -n "$PR_NUMBER" ]; then
            git push origin "$BRANCH_NAME"
            echo "Appended a commit to PR #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # No open PR, so the branch is either absent or left over from a
          # merged one. Force-push is safe here: nothing references it.
          git push --force origin "$BRANCH_NAME"

          gh pr create \
            --title "chore: refresh LangSmith platform OpenAPI spec" \
            --body "$(cat <<'EOF'
          ## Summary
          Automated daily refresh of the LangSmith Platform API spec.

          ## Details
          - Fetched latest spec from api.smith.langchain.com
          - Applied post-processing: hid fleet/internal endpoints, added human-readable group tags
          - Output: `src/langsmith/langsmith-platform-openapi.json`
          - Generated by `scripts/process_langsmith_openapi.py`

          Later refreshes append a commit to this PR while it stays open, so
          only one refresh PR is ever outstanding.

          🤖 This PR was created automatically by GitHub Actions
          EOF
          )" \
            --base main \
            --head "$BRANCH_NAME"

          echo "Opened a new refresh PR" >> "$GITHUB_STEP_SUMMARY"
