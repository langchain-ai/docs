---
name: Lint prose

on:
  pull_request:
    paths:
      - "src/**/*.md"
      - "src/**/*.mdx"

jobs:
  lint-prose:
    name: Vale on changed docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed doc files
        id: changed-files
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          BASE=$(git merge-base HEAD "origin/$BASE_REF")
          FILES=$(git diff --name-only --diff-filter=ACMRTUXB "$BASE" HEAD -- src/ |
            grep -E '\.(md|mdx)$' || true)
          if [ -z "$FILES" ]; then
            echo "No doc files changed, skipping"
            echo "count=0" >> $GITHUB_OUTPUT
          else
            echo "count=$(echo "$FILES" | wc -l)" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            printf '%s\n' "$FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # Installs the version pinned in .mise.toml so CI and local runs use the
      # same engine. Bump the pin there, not here.
      - name: Install Vale
        if: steps.changed-files.outputs.count != '0'
        run: bash scripts/install-vale.sh .bin/vale

      - name: Lint prose
        if: steps.changed-files.outputs.count != '0'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          echo "Linting changed files:"
          echo "$CHANGED_FILES" | sed 's/^/  - /'
          make lint_prose FILES="$(echo "$CHANGED_FILES" | tr '\n' ' ')"
