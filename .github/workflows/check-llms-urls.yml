---
name: Check llms.txt URLs resolve

# Mintlify generates llms.txt and splits it into nested /_llms/ indexes. None
# of that is produced or checked in this repo, and a gap only shows up against
# the deployed site. This job crawls the served index, fails if any sitemap page
# is unreachable from it, and spot-checks that listed pages resolve.

on:
  schedule:
    # Weekly, Monday 07:13 UTC. Off the hour to avoid the scheduler rush.
    - cron: "13 7 * * 1"
  workflow_dispatch:
    inputs:
      check_all:
        description: "Check every URL instead of a sample"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.13"

      - name: Check the served llms.txt index
        run: |
          uv run python scripts/check_llms_urls.py \
            ${{ inputs.check_all && '--all' || '' }}
