---
name: Check llms.txt coverage

# Mintlify generates llms.txt and splits it into nested /_llms/ indexes. None
# of that is produced or checked in this repo, and a gap only shows up against
# the deployed site. This job crawls the served index and fails if any sitemap
# page is unreachable from it.

on:
  schedule:
    # Weekly, Monday 07:13 UTC. Off the hour to avoid the scheduler rush.
    - cron: "13 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the served llms.txt index
        run: python3 scripts/check_llms_urls.py
