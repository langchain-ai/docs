# Retired product names. LangGraph Platform became LangSmith Deployment, which is now
# LangSmith Agent Server. Changelogs keep the old names as history, so .vale.ini turns
# this rule off for them.
# Only add names a product no longer uses. Spelling fixes for current names, such as
# DeepAgents to Deep Agents, belong in Terminology.yml.
# Matching stays case-sensitive on "Deployment" and "Platform": lowercase "LangSmith
# deployment" is a common noun for a self-hosted LangSmith installation. "Lang[Ss]mith"
# catches the miscapitalized brand, which hid one use of the old name.
extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: false
swap:
  Lang[Ss]mith Deployments?: LangSmith Agent Server
  LangGraph [Pp]latform: LangSmith Agent Server
  LangGraph Deployments?: LangSmith Agent Server
