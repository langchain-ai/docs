# Retired product names. LangSmith Deployment is now LangSmith Agent Server.
# Changelogs keep the old names as history, so .vale.ini turns this rule off for them.
# Only add names a product no longer uses. Spelling fixes for current names, such as
# DeepAgents to Deep Agents, belong in Terminology.yml.
extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: false
swap:
  LangSmith Deployments?: LangSmith Agent Server
