# Retired navigation labels for the workspace secrets page. LangSmith Cloud lists it as
# Settings > Workspace > Configuration > Secrets. Self-hosted v0.16 to v0.18 use older
# labels, which only src/langsmith/workspace-secrets.mdx documents, so .vale.ini turns
# this rule off for that page. Link to
# /langsmith/workspace-secrets#open-the-secrets-page instead of repeating the path.
# src/snippets/langsmith/set-workspace-secrets.mdx also states the Cloud path for the
# quickstarts. This rule does not catch drift there, so update it with the page.
extends: existence
message: "Link to /langsmith/workspace-secrets#open-the-secrets-page instead of naming the old settings label ('%s')."
level: error
scope: raw
nonword: true
ignorecase: false
tokens:
 - '\*\*Provider secrets\*\*'
 - '\*\*Provider Credentials\*\*'
 - 'Integrations\s*>\s*Provider secrets'
