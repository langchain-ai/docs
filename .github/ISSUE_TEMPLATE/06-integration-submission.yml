name: Integration listing
description: Request that your published LangChain integration be listed in the docs.
title: "[integration]: <package or display name>"
labels: [integration-submission, integration]
body:
  - type: markdown
    attributes:
      value: |
        Use this form after your package is published on PyPI or npm.

        An automation opens a docs PR from these fields. Prefer partner docs URLs.
        See [Publish an integration](https://docs.langchain.com/oss/python/contributing/publish-langchain#make-your-integration-discoverable).

        All contributions must be in English. See the
        [language policy](https://docs.langchain.com/oss/python/contributing/overview#language-policy).

  - type: input
    id: display_name
    attributes:
      label: Display or class name
      description: Name shown in tables and cards (for example ChatAcme or AcmeToolkit).
      placeholder: ChatAcme
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Which ecosystem should list this integration?
      options:
        - Python
        - TypeScript
        - Both
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component type
      description: Primary LangChain component this package integrates with.
      options:
        - chat
        - tools
        - middleware
        - vectorstores
        - callbacks
        - embeddings
        - retrievers
        - document_loaders
        - document_transformers
        - llms
        - sandboxes
        - stores
        - caches
        - chat_message_histories
        - graphs
        - llm_caching
    validations:
      required: true

  - type: input
    id: pypi_package
    attributes:
      label: PyPI package name
      description: Required for Python (or Both). Use the installable name without extras (for example langchain-acme).
      placeholder: langchain-acme
    validations:
      required: false

  - type: input
    id: npm_package
    attributes:
      label: npm package name
      description: Required for TypeScript (or Both). Include the scope if any (for example @acme/langchain).
      placeholder: "@acme/langchain"
    validations:
      required: false

  - type: input
    id: docs_url
    attributes:
      label: Docs URL
      description: Prefer your partner docs LangChain guide. Otherwise the public GitHub README or registry page.
      placeholder: https://docs.example.com/integrations/langchain
    validations:
      required: true

  - type: input
    id: github_repo
    attributes:
      label: Source repository
      description: owner/repo on GitHub (or leave blank if there is no public repo).
      placeholder: acme/langchain-acme
    validations:
      required: false

  - type: textarea
    id: provider_description
    attributes:
      label: Short provider description
      description: One sentence for the all-providers card. Factual only; do not market.
      placeholder: Vector store for AcmeDB with hybrid search.
    validations:
      required: true

  - type: textarea
    id: capability_notes
    attributes:
      label: Capability flags (optional)
      description: >
        For chat or vectorstores, list supported capabilities as key: true/false
        lines (for example stream: true, tool_calling: true, delete_by_id: true).
        Leave blank if unsure; automation will omit unknown flags.
      placeholder: |
        stream: true
        tool_calling: true
        structured_output: false
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: The package is already published on PyPI and/or npm.
          required: true
